<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b2a47">
<title>DBASO Kasir</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<style>
  :root { --navy:#1b2a47; --navy2:#24365a; --oranye:#f97316; --biru:#2563eb; --hijau:#16a34a; --merah:#dc2626; --kuning:#b45309;
    --abu:#64748b; --garis:#e2e8f0; --latar:#f1f5f9; --kartu:#ffffff; --teks:#0f172a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--latar); color:var(--teks); font:15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior:none; }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:10px 14px; background:var(--biru); color:#fff; font-weight:600; min-height:44px; }
  button:disabled { opacity:.45; cursor:default; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--garis); }
  button.merah { background:var(--merah); }
  button.hijau { background:var(--hijau); }
  input, select, textarea { font:inherit; width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:10px; background:#fff; min-height:44px; color:var(--teks); }
  label.lbl { display:block; font-size:13px; color:var(--abu); margin:10px 0 4px; font-weight:600; }
  .err { color:var(--merah); font-size:13.5px; min-height:18px; margin-top:6px; white-space:pre-line; }
  .hint { color:var(--abu); font-size:12.5px; }
  .layar { position:fixed; inset:0; display:none; }
  .layar.on { display:flex; }

  /* ---------- pasang perangkat ---------- */
  #lyPasang { align-items:center; justify-content:center; background:var(--navy); padding:16px; overflow:auto; }
  .kotakPasang { background:#fff; border-radius:16px; padding:22px; width:100%; max-width:420px; }
  .kotakPasang h1 { margin:0 0 4px; font-size:20px; }

  /* ---------- PIN ---------- */
  #lyPin { align-items:center; justify-content:center; background:var(--navy); color:#fff; flex-direction:column; gap:14px; padding:16px; }
  #lyPin .cab { font-size:14px; opacity:.8; }
  #lyPin h2 { margin:0; font-size:20px; }
  .titik { display:flex; gap:16px; margin:6px 0; }
  .titik span { width:16px; height:16px; border-radius:50%; border:2px solid #fff; }
  .titik span.isi { background:#fff; }
  .pad { display:grid; grid-template-columns:repeat(3, 76px); gap:12px; }
  .pad button { height:76px; border-radius:50%; font-size:26px; background:var(--navy2); }
  .pad button.kosong { visibility:hidden; }
  #pinPesan { min-height:20px; color:#fecaca; font-size:14px; text-align:center; }
  #lyPin .bawah { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; justify-content:center; }
  #lyPin .bawah button { background:transparent; border:1px solid rgba(255,255,255,.35); font-weight:500; }

  /* ---------- utama ---------- */
  #lyUtama { flex-direction:column; }
  .bar { height:56px; background:var(--navy); color:#fff; display:flex; align-items:center; gap:8px; padding:0 8px; flex:0 0 auto; }
  .bar button { background:transparent; min-height:44px; padding:8px 10px; }
  .bar .ikon { font-size:22px; width:48px; }
  .bar .namaCab { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:28vw; }
  #stSync { font-size:12.5px; font-weight:500; background:rgba(255,255,255,.1); border-radius:999px; padding:6px 12px; min-height:34px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34vw; }
  #stSync.belum { background:#fde68a; color:#78350f; }
  #stSync.gagal { background:#fecaca; color:#7f1d1d; }
  .bar .isi { flex:1; }
  #btnSimpanan { font-size:13.5px; font-weight:600; border:1px solid rgba(255,255,255,.3); white-space:nowrap; display:flex; align-items:center; gap:2px; }
  .badge { display:inline-block; min-width:20px; padding:0 6px; border-radius:999px; background:var(--oranye); color:#fff; font-size:12px; line-height:20px; text-align:center; margin-left:4px; }

  .badan { flex:1; display:flex; min-height:0; }
  #kat { width:170px; flex:0 0 auto; background:#fff; border-right:1px solid var(--garis); overflow-y:auto; padding:8px; }
  #kat button { display:block; width:100%; text-align:left; background:transparent; color:var(--navy); font-weight:600; margin-bottom:4px; border-radius:10px; padding:12px; }
  #kat button.on { background:var(--navy); color:#fff; }
  .tengah { flex:1; display:flex; flex-direction:column; min-width:0; }
  .cariBar { padding:8px; border-bottom:1px solid var(--garis); background:#fff; }
  #grid { flex:1; overflow-y:auto; padding:10px; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; align-content:start; }
  .prd { background:#fff; border:1px solid var(--garis); border-radius:12px; padding:0; text-align:left; color:var(--teks); min-height:96px; display:flex; flex-direction:column; overflow:hidden; font-weight:500; }
  .prd .warna { height:6px; }
  .prd .nm { padding:10px 10px 4px; font-weight:700; font-size:15px; flex:1; }
  .prd .hg { padding:0 10px 10px; color:var(--navy); font-weight:700; display:flex; justify-content:space-between; align-items:flex-end; gap:6px; }
  .prd .stk { font-size:11.5px; font-weight:600; color:var(--abu); }
  .prd .stk.habis { color:var(--merah); }
  .prd:disabled { opacity:.4; }
  .kosongInfo { grid-column:1/-1; text-align:center; color:var(--abu); padding:40px 10px; }

  #keranjang { width:420px; flex:0 0 auto; background:#fff; border-left:1px solid var(--garis); display:flex; flex-direction:column; min-height:0; }
  .krAtas { display:flex; gap:8px; padding:8px; border-bottom:1px solid var(--garis); }
  .krAtas button { flex:1; }
  #krList { flex:1; overflow-y:auto; }
  .brs { display:flex; gap:10px; padding:10px 12px; border-bottom:1px solid #f1f5f9; background:#fff; width:100%; text-align:left; color:var(--teks); font-weight:400; border-radius:0; }
  .brs .q { font-weight:800; color:var(--navy); min-width:34px; }
  .brs .n { flex:1; }
  .brs .n b { display:block; }
  .brs .n small { display:block; color:var(--abu); }
  .brs .n .cat { display:inline-block; margin-top:3px; background:#fff7ed; color:#9a3412; border:1px solid #fed7aa; border-radius:6px; padding:0 6px; font-size:12px; }
  .brs .r { font-weight:700; white-space:nowrap; }
  .brs.tolak { background:#fef2f2; }
  .krBawah { border-top:1px solid var(--garis); padding:10px 12px; }
  .krBawah .ln { display:flex; justify-content:space-between; margin:2px 0; }
  .krBawah .tot { font-size:20px; font-weight:800; }
  #btnBayar { width:100%; margin-top:8px; font-size:18px; min-height:56px; background:var(--hijau); }
  #btnLihatKr, #btnTutupKr, .tksHp { display:none; }

  /* ---------- modal ---------- */
  .modal { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:12px; }
  .modal.on { display:flex; }
  .mBox { background:#fff; border-radius:16px; width:100%; max-width:560px; max-height:calc(100% - 8px); display:flex; flex-direction:column; overflow:hidden; }
  .mHead { padding:14px 16px; border-bottom:1px solid var(--garis); display:flex; align-items:center; gap:10px; }
  .mHead h3 { margin:0; font-size:17px; flex:1; }
  .mHead .x { background:transparent; color:var(--abu); font-size:24px; padding:4px 10px; }
  .mIsi { padding:14px 16px; overflow-y:auto; flex:1; }
  .mKaki { padding:12px 16px; border-top:1px solid var(--garis); display:flex; gap:10px; }
  .mKaki button { flex:1; }
  .pilih { display:flex; flex-wrap:wrap; gap:8px; }
  .pilih button { background:#fff; color:var(--navy); border:1px solid #cbd5e1; font-weight:600; }
  .pilih button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .grupOp { margin-bottom:14px; }
  .grupOp .jd { font-weight:700; margin-bottom:6px; }
  .opRow { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #f1f5f9; }
  .opRow .nm { flex:1; }
  .step { display:flex; align-items:center; gap:6px; }
  .step button { width:44px; padding:0; background:#fff; color:var(--navy); border:1px solid #cbd5e1; font-size:20px; }
  .step span { min-width:28px; text-align:center; font-weight:700; }
  .angkaBesar { font-size:26px; font-weight:800; text-align:center; }
  .menu { position:fixed; inset:0; z-index:40; display:none; }
  .menu.on { display:block; }
  .menu .tirai { position:absolute; inset:0; background:rgba(15,23,42,.45); }
  .menu .laci { position:absolute; top:0; bottom:0; left:0; width:320px; max-width:86vw; background:#fff; overflow-y:auto; }
  .laci .kepala { background:var(--navy); color:#fff; padding:16px; }
  .laci .kepala b { font-size:17px; }
  .laci .kepala button { width:100%; margin-top:10px; background:var(--oranye); }
  .laci .itm { display:block; width:100%; text-align:left; background:#fff; color:var(--teks); border-radius:0; border-bottom:1px solid #f1f5f9; padding:14px 16px; font-weight:600; }
  .laci .itm small { display:block; font-weight:400; color:var(--abu); }
  .tumpuk { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#0f172a; color:#fff; padding:10px 16px; border-radius:10px; z-index:90; max-width:90vw; font-size:14px; display:none; white-space:pre-line; }
  .tbl { width:100%; border-collapse:collapse; font-size:14px; }
  .tbl td { padding:6px 4px; border-bottom:1px solid #f1f5f9; vertical-align:top; }
  .tbl td.r { text-align:right; white-space:nowrap; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .pill.ok { background:#dcfce7; color:#166534; } .pill.blm { background:#fef3c7; color:#92400e; } .pill.tlk { background:#fee2e2; color:#991b1b; }

  /* ---------- HP (portrait) ---------- */
  @media (max-width: 899px) {
    .bar .namaCab { max-width:30vw; }
    #btnSimpanan .tks { display:none; }
    #btnSimpanan .tksHp, #btnTutupKr { display:inline; }
    #btnTutupKr { display:block; }
    .badan { flex-direction:column; }
    #kat { width:auto; display:flex; gap:6px; overflow-x:auto; overflow-y:hidden; border-right:0; border-bottom:1px solid var(--garis); padding:6px 8px; flex:0 0 auto; }
    #kat button { width:auto; white-space:nowrap; margin:0; padding:8px 14px; }
    #grid { grid-template-columns:repeat(2, minmax(0,1fr)); padding-bottom:84px; }
    #keranjang { position:fixed; inset:56px 0 0 0; width:auto; z-index:30; display:none; border-left:0; }
    #keranjang.on { display:flex; }
    #btnLihatKr { display:flex; position:fixed; left:10px; right:10px; bottom:10px; z-index:20; min-height:56px; justify-content:space-between; align-items:center; background:var(--hijau); font-size:16px; }
  }
  @media (min-width: 900px) and (max-width: 1150px) { #keranjang { width:360px; } #kat { width:140px; } }
</style>
</head>
<body>

<!-- ================= PASANG PERANGKAT ================= -->
<div class="layar" id="lyPasang">
  <div class="kotakPasang">
    <h1>Pasang tablet kasir</h1>
    <div class="hint">Login <b>sekali</b> pakai akun cabang dari Hub DBASO. Setelah itu kasir masuk dengan PIN.</div>
    <div id="pasangInfo" class="err" style="color:var(--kuning);"></div>
    <div id="boxServer">
      <label class="lbl" for="inServer">Alamat server (Hub › Fungsi POS › Perangkat Kasir)</label>
      <input id="inServer" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
    </div>
    <label class="lbl" for="inUser">Username akun cabang</label>
    <input id="inUser" autocomplete="username" autocapitalize="none">
    <label class="lbl" for="inPass">Password</label>
    <input id="inPass" type="password" autocomplete="current-password">
    <label class="lbl" for="inNamaDev">Nama perangkat</label>
    <input id="inNamaDev" placeholder="Contoh: Tablet depan" maxlength="40">
    <div id="boxCabAdmin" style="display:none;">
      <label class="lbl" for="inCabAdmin">Kode cabang (khusus akun admin, untuk uji)</label>
      <input id="inCabAdmin" placeholder="MGS" maxlength="10" autocapitalize="characters">
    </div>
    <div class="err" id="pasangErr"></div>
    <button id="btnPasang" style="width:100%; margin-top:10px;">Pasang</button>
  </div>
</div>

<!-- ================= PIN ================= -->
<div class="layar" id="lyPin">
  <div class="cab" id="pinCab"></div>
  <h2 id="pinJudul">Masukkan PIN kasir</h2>
  <div class="titik" id="pinTitik"><span></span><span></span><span></span><span></span></div>
  <div id="pinPesan"></div>
  <div class="pad" id="pinPad"></div>
  <div class="bawah">
    <button id="pinSync">⟳ Sync data kasir</button>
    <button id="pinKeluar">Keluar perangkat</button>
  </div>
</div>

<!-- ================= UTAMA ================= -->
<div class="layar" id="lyUtama">
  <div class="bar">
    <button class="ikon" id="btnMenu" aria-label="Menu">☰</button>
    <span class="namaCab" id="barCab"></span>
    <button id="stSync" title="Tekan untuk sync"></button>
    <span class="isi"></span>
    <button id="btnSimpanan"><span class="tks">Keranjang Tersimpan</span><span class="tksHp">🗂</span><span class="badge" id="bdSimpanan">0</span></button>
    <button class="ikon" id="btnTitik" aria-label="Lainnya">⋮</button>
  </div>
  <div class="badan">
    <div id="kat"></div>
    <div class="tengah">
      <div class="cariBar"><input id="inCari" placeholder="Cari produk..." autocomplete="off"></div>
      <div id="grid"></div>
    </div>
    <div id="keranjang">
      <button class="ghost" id="btnTutupKr" style="border-radius:0; border-width:0 0 1px 0; text-align:left;">‹ Kembali ke produk</button>
      <div class="krAtas">
        <button class="ghost" id="btnTipe">Toko ▾</button>
        <button class="ghost" id="btnPelanggan">+ Pelanggan</button>
      </div>
      <div id="krList"></div>
      <div class="krBawah">
        <div class="ln"><span>Subtotal</span><span id="krSub">Rp 0</span></div>
        <div class="ln" id="krDiskonLn" style="display:none; color:var(--merah);"><span id="krDiskonLbl">Diskon</span><span id="krDiskon"></span></div>
        <div class="ln tot"><span>Total</span><span id="krTot">Rp 0</span></div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="ghost" id="btnSimpan" style="flex:1;">Simpan</button>
          <button class="ghost" id="btnHapusKr" style="flex:1;">Kosongkan</button>
        </div>
        <button id="btnBayar">Bayar</button>
      </div>
    </div>
  </div>
  <button id="btnLihatKr"><span id="lkJml">0 item</span><span id="lkTot">Rp 0</span></button>
</div>

<!-- ================= MENU ☰ ================= -->
<div class="menu" id="menu">
  <div class="tirai" id="menuTirai"></div>
  <div class="laci">
    <div class="kepala">
      <b id="mCab"></b>
      <div class="hint" style="color:#cbd5e1;" id="mInfo"></div>
      <button id="mSync">⟳ SYNC DATA</button>
    </div>
    <button class="itm" data-m="baru">🧾 Transaksi Baru</button>
    <button class="itm" data-m="simpanan">🗂 Keranjang Tersimpan</button>
    <button class="itm" data-m="riwayat">📜 Riwayat Transaksi</button>
    <button class="itm" data-m="kas">💸 Kas Keluar<small>Beli barang di cabang / biaya lain</small></button>
    <button class="itm" data-m="tutup">🔒 Rekap Kas &amp; Tutup Kasir</button>
    <button class="itm" data-m="tampilan">🎨 Atur Tampilan<small>Urutan kategori, sembunyikan produk</small></button>
    <button class="itm" data-m="printer" disabled>🖨 Pengaturan Printer<small>Menyusul (tahap 4)</small></button>
    <button class="itm" data-m="ganti">👤 Ganti Kasir</button>
    <button class="itm" data-m="keluar" style="color:var(--merah);">⏏ Keluar Perangkat</button>
    <div class="hint" style="padding:12px 16px;" id="mVersi"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="mBox"><div class="mHead"><h3 id="mJudul"></h3><button class="x" id="mTutup" aria-label="Tutup">×</button></div>
  <div class="mIsi" id="mIsi"></div><div class="mKaki" id="mKaki"></div></div></div>
<div class="tumpuk" id="tumpuk"></div>

<script>
'use strict';
const VERSI_APP = '1.0.1 (25 Nov 2026)';
// =====================================================================
// PENYIMPANAN DI TABLET (IndexedDB, kunci -> nilai)
// =====================================================================
const DB = (() => {
  let dbp = null;
  const buka = () => dbp || (dbp = new Promise((ok, no) => {
    const r = indexedDB.open('dbaso-kasir', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  }));
  const tx = async (mode, f) => { const db = await buka(); return new Promise((ok, no) => {
    const t = db.transaction('kv', mode); const s = t.objectStore('kv'); const req = f(s);
    t.oncomplete = () => ok(req && req.result); t.onerror = () => no(t.error); t.onabort = () => no(t.error); }); };
  return { get: k => tx('readonly', s => s.get(k)), set: (k, v) => tx('readwrite', s => s.put(v, k)), del: k => tx('readwrite', s => s.delete(k)) };
})();

// =====================================================================
// KEADAAN
// =====================================================================
const S = {
  sesi: null,        // { server, token, idPerangkat, kodePerangkat, cabang:{kode,nama}, akun }
  master: null,      // hasil sync
  syncJam: '',       // jam sync terakhir berhasil
  kasir: null,       // { id, nama } yang sedang aktif (tidak disimpan: setiap buka aplikasi minta PIN)
  shift: null,       // { id, idKasir, namaKasir, buka, modal }
  antrian: { transaksi: [], kasKeluar: [], shift: [] },
  riwayat: [],       // transaksi perangkat ini (terbaru dulu, maks 600)
  kasLokal: [],      // kas keluar perangkat ini (maks 300)
  simpanan: [],      // keranjang tersimpan
  seq: {},           // nomor urut per tanggal
  kr: null,          // keranjang aktif
  katAktif: '',
  sedangSync: false, gagalSync: '',
  terakhirSentuh: Date.now(),
  pinSalah: 0, pinKunciSampai: 0
};
const simpanKe = (k) => DB.set(k, S[k]);
async function muatSemua() {
  for (const k of ['sesi', 'master', 'syncJam', 'shift', 'antrian', 'riwayat', 'kasLokal', 'simpanan', 'seq']) {
    const v = await DB.get(k);
    if (v !== undefined) S[k] = v;
  }
  S.antrian = Object.assign({ transaksi: [], kasKeluar: [], shift: [] }, S.antrian || {});
  S.kr = (await DB.get('kr')) || krBaru();
}
function krBaru() { return { tipe: 'TOKO', pelanggan: '', item: [], diskon: null }; }
const simpanKr = () => DB.set('kr', S.kr);

// =====================================================================
// ALAT BANTU
// =====================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
const angka = n => Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: 3 });
const p2 = n => String(n).padStart(2, '0');
function waktu(d) { d = d || new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); }
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
let tTumpuk = 0;
function tumpuk(t, ms) { const el = $('tumpuk'); el.textContent = t; el.style.display = 'block'; clearTimeout(tTumpuk); tTumpuk = setTimeout(() => { el.style.display = 'none'; }, ms || 2600); }
function tampil(id) { document.querySelectorAll('.layar').forEach(l => l.classList.toggle('on', l.id === id)); }
function sedangDi(id) { return $(id).classList.contains('on'); }

// ---------- modal umum ----------
let mOnTutup = null, mLuar = false, mSibuk = false;
// opsi.luar = true: tekan di luar kotak menutup (hanya untuk daftar/pilihan). Selain itu kotak hanya tertutup lewat tombolnya.
function modal(judul, isiHtml, tombol, onTutup, opsi) {
  mLuar = !!(opsi && opsi.luar); sibuk(false);
  $('mJudul').textContent = judul; $('mIsi').innerHTML = isiHtml;
  const k = $('mKaki'); k.innerHTML = '';
  (tombol || []).forEach(b => {
    const el = document.createElement('button'); el.textContent = b.t; if (b.c) el.className = b.c; if (b.id) el.id = b.id;
    el.onclick = b.f; k.appendChild(el);
  });
  k.style.display = (tombol || []).length ? 'flex' : 'none';

async function api(aksi, data, token) {
  const server = (S.sesi && S.sesi.server) || '';
  if (!navigator.onLine) throw Object.assign(new Error('Tidak ada internet.'), { offline: true });
  let r;
  try {
    r = await fetch(server, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ aksi: aksi, token: token === undefined ? (S.sesi && S.sesi.token) : token, data: data || {} }) });
  } catch (e) { throw Object.assign(new Error('Server tidak bisa dihubungi (sinyal lemah?).'), { offline: true }); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Balasan server tidak terbaca. Cek alamat server (harus berakhiran /exec).'); }
  if (!j.ok) throw Object.assign(new Error(j.pesan || 'Gagal.'), { kode: j.kode });
  return j;
}

function stokSisa() {

  S.antrian.transaksi.forEach(t => t.item.forEach(it => {
    (it.potong || []).forEach(b => { s[b.kode] = (s[b.kode] || 0) - b.jumlah * it.jumlah; });
    (it.opsi || []).forEach(o => (o.potong || []).forEach(b => { s[b.kode] = (s[b.kode] || 0) - b.jumlah * it.jumlah; }));
  }));

    (it.potong || []).forEach(b => { s[b.kode] = (s[b.kode] || 0) + b.jumlah * it.jumlah; });
    (it.opsi || []).forEach(o => (o.potong || []).forEach(b => { s[b.kode] = (s[b.kode] || 0) + b.jumlah * it.jumlah; })); });

  Object.keys(perlu).forEach(k => {
    const ada = (sisa[k] || 0) - (pakai[k] || 0);
    if (ada < perlu[k] - 1e-9) kurang.push((M().stok[k] ? M().stok[k].nama : k) + ' (sisa ' + angka(Math.max(0, ada)) + ')');
  });
  if (kurang.length) tumpuk('⚠ Stok kurang: ' + kurang.join(', ') + '. Tetap dijual.', 3500);

}

}
function teksPilihan(it) {

}

  if (S.kr.diskon) { $('krDiskonLbl').textContent = 'Diskon ' + (S.kr.diskon.jenis === 'PERSEN' ? S.kr.diskon.nilai + '% ' : '') + '(' + S.kr.diskon.namaAlasan + ')'; $('krDiskon').textContent = '− ' + rp(h.diskon); }
  $('krTot').textContent = rp(h.total);

      });
      html += '</div>';
    });
    const pilihan = kumpulPilihan();
    const tmp = { kode: p.kode, pilihan: pilihan, jumlah: jumlah };
    const hb = hitungBaris(tmp, S.kr.tipe);
    html += '<div class="opRow" style="border:0;"><span class="nm"><b>Jumlah</b></span><span class="step"><button data-j="-1">−</button><span>' + jumlah + '</span><button data-j="1">+</button></span></div>' +

    if (b.dataset.j) { jumlah = Math.max(1, jumlah + Number(b.dataset.j)); gambar(); return; }
    const g = p.opsi.find(x => x.kode === b.dataset.g); if (!g) return;

function ringkasOpsi(opsi) { const c = {}; opsi.forEach(o => { c[o.nama] = (c[o.nama] || 0) + 1; }); return Object.keys(c).map(k => k + (c[k] > 1 ? ' ×' + c[k] : '')).join(', '); }
function namaMetode(k) { const m = M().metode.find(x => x.kode === k); return m ? m.nama : k; }
function pillStatus(s, pesan) { return s === 'TERKIRIM' ? '<span class="pill ok">terkirim</span>' : s === 'DITOLAK' ? '<span class="pill tlk" title="' + esc(pesan || '') + '">ditolak server</span>' : '<span class="pill blm">belum terkirim</span>'; }
function tampilStruk(t, baru) {
  modal(baru ? 'Transaksi selesai' : 'Transaksi ' + t.no, (baru && t.metode === 'TUNAI' ? '<div class="angkaBesar" style="color:var(--hijau); margin-bottom:10px;">Kembali ' + rp(t.kembali) + '</div>' : '') +
    htmlStruk(t) + '<div style="margin-top:8px;">' + pillStatus(t.status, t.pesan) + (t.pesan ? '<div class="err">' + esc(t.pesan) + '</div>' : '') + '</div>' +
    '<div class="hint" style="margin-top:8px;">Cetak struk menyusul (tahap 4: printer).</div>',
    [{ t: baru ? 'Transaksi baru' : 'Tutup', c: baru ? 'hijau' : '', f: tutupModal }]);
}

// =====================================================================
// SYNC
// =====================================================================
async function sinkron(paksa) {
  if (!S.sesi || !S.sesi.token || S.sedangSync) return;
  if (!navigator.onLine) { S.gagalSync = 'offline'; gambarSyncAman(); return; }
  S.sedangSync = true; S.gagalSync = ''; gambarSyncAman();
  try {
    // 1) kirim data yang belum terkirim, maks 50 per kiriman
    for (let putaran = 0; putaran < 20; putaran++) {
      const trx = S.antrian.transaksi.slice(0, 50);
      const kas = S.antrian.kasKeluar.slice(0, 50 - trx.length);
      const shf = S.antrian.shift.slice(0, 20);
      if (!trx.length && !kas.length && !shf.length) break;
      const r = await api('kirim', { transaksi: trx, kasKeluar: kas, shift: shf });
      const beres = (list, res, riwayat) => {
        const st = {}; (res || []).forEach(x => { st[x.id] = x; });
        list.forEach(x => {
          const h = st[x.id]; if (!h) return;
          const ri = riwayat ? riwayat.find(y => y.id === x.id) : null;
          if (ri) { ri.status = h.status === 'DITOLAK' ? 'DITOLAK' : 'TERKIRIM'; ri.pesan = h.pesan || (h.peringatan || []).join(' | '); }
        });
        return x => !st[x.id];
      };
      S.antrian.transaksi = S.antrian.transaksi.filter(beres(trx, r.transaksi, S.riwayat));
      S.antrian.kasKeluar = S.antrian.kasKeluar.filter(beres(kas, r.kasKeluar, S.kasLokal));
      const okShift = {}; (r.shift || []).forEach(x => { okShift[x.id] = true; });
      S.antrian.shift = S.antrian.shift.filter((x, i) => !(i < shf.length && okShift[x.id]));
      await Promise.all([simpanKe('antrian'), simpanKe('riwayat'), simpanKe('kasLokal')]);
      const tolak = (r.transaksi || []).concat(r.kasKeluar || []).filter(x => x.status === 'DITOLAK');
      if (tolak.length) tumpuk('⚠ ' + tolak.length + ' data DITOLAK server: ' + tolak[0].pesan + '\nLapor admin. Lihat di Riwayat.', 6000);
    }
    // 2) ambil data terbaru
    const d = await api('sync', {});
    S.master = d; S.syncJam = waktu();
    await Promise.all([simpanKe('master'), simpanKe('syncJam')]);
    if (S.kasir && !d.kasir.some(k => k.id === S.kasir.id)) { S.sedangSync = false; bukaPin('Kasir ' + S.kasir.nama + ' sudah tidak aktif di cabang ini.'); return; }
  } catch (e) {
    S.gagalSync = e.message;
    if (e.kode === 'TOKEN') { S.sedangSync = false; const n = belumTerkirim(); S.sesi.token = ''; await simpanKe('sesi'); S.kasir = null;
      bukaPasang(e.message + (n ? '\n' + n + ' data belum terkirim TETAP tersimpan di tablet ini, terkirim setelah login ulang.' : '')); return; }
    if (paksa) tumpuk('Sync gagal: ' + e.message, 4000);
  } finally { S.sedangSync = false; gambarSyncAman(); }
}
function gambarSyncAman() { if (sedangDi('lyUtama')) { gambarSync(); if (!S.sedangSync) { gambarKategori(); gambarGrid(); gambarKeranjang(); } } }
$('stSync').onclick = () => sinkron(true);
setInterval(() => { if (S.sesi && S.sesi.token && S.kasir) sinkron(); }, 5 * 60000);
window.addEventListener('online', () => sinkron());

// MENU ☰
// =====================================================================
$('btnMenu').onclick = () => {
  $('mCab').textContent = S.sesi.cabang.nama + ' · ' + S.sesi.kodePerangkat;
  $('mInfo').innerHTML = 'Kasir: ' + esc(S.kasir.nama) + '<br>' + (S.shift ? 'Kasir dibuka ' + esc(S.shift.buka.slice(0, 16)) + ', modal ' + rp(S.shift.modal) : 'Kasir belum dibuka') +
    '<br>' + belumTerkirim() + ' data belum terkirim' + (S.syncJam ? ' · sync ' + esc(S.syncJam.slice(5, 16)) : '');
  $('mVersi').textContent = 'DBASO Kasir ' + VERSI_APP;
  $('menu').classList.add('on');
};
$('menuTirai').onclick = () => $('menu').classList.remove('on');
$('mSync').onclick = async () => { $('menu').classList.remove('on'); await sinkron(true); };
document.querySelectorAll('.laci .itm').forEach(b => b.onclick = () => { $('menu').classList.remove('on'); menuAksi(b.dataset.m); });
function menuAksi(m) {
  if (m === 'baru') { if (S.kr.item.length) tanya('Transaksi baru', 'Keranjang sekarang akan dikosongkan. Simpan dulu kalau masih dipakai.', () => { S.kr = krBaru(); simpanKr(); gambarSemua(); }, 'Kosongkan'); }
  else if (m === 'simpanan') dialogSimpanan();
  else if (m === 'riwayat') dialogRiwayat();
  else if (m === 'kas') dialogKas();
  else if (m === 'tutup') dialogTutup();
  else if (m === 'tampilan') dialogTampilan();
  else if (m === 'ganti') bukaPin();
  else if (m === 'keluar') keluarPerangkat();
}
function dialogRiwayat() {
  const hariIni = waktu().slice(0, 10);
  const list = S.riwayat.filter(t => t.waktu.slice(0, 10) === hariIni || t.status !== 'TERKIRIM');
  const total = list.filter(t => t.waktu.slice(0, 10) === hariIni).reduce((a, t) => a + t.total, 0);
  modal('Riwayat transaksi', '<div class="hint" style="margin-bottom:8px;">Hari ini: ' + list.filter(t => t.waktu.slice(0, 10) === hariIni).length + ' transaksi, ' + rp(total) + '. Data lebih lama ada di Hub.</div>' +
    (list.length ? list.map((t, i) => '<button class="brs" data-r="' + S.riwayat.indexOf(t) + '"><span class="n"><b>' + esc(t.no) + '</b><small>' + esc(t.waktu.slice(11, 16) + ' · ' + namaTipe(t.tipe) + ' · ' + namaMetode(t.metode) + ' · ' + t.namaKasir) + '</small>' +
      pillStatus(t.status, t.pesan) + '</span><span class="r">' + rp(t.total) + '</span></button>').join('') : '<div class="kosongInfo">Belum ada transaksi hari ini.</div>'), [], null, { luar: true });
  $('mIsi').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; tampilStruk(S.riwayat[Number(b.dataset.r)], false); };
}
// ---------- kas keluar ----------
function dialogKas() {
  if (!S.shift) { tumpuk('Buka kasir dulu.'); return; }
  const beli = M().beliCabang || [], batas = M().batasKasKeluar || 0;
  let jenis = beli.length ? 'BELI' : 'BIAYA';
  const gambar = () => {
    $('mIsi').innerHTML = '<div class="pilih"><button data-j="BELI" class="' + (jenis === 'BELI' ? 'on' : '') + '"' + (beli.length ? '' : ' disabled') + '>Beli barang</button>' +
      '<button data-j="BIAYA" class="' + (jenis === 'BIAYA' ? 'on' : '') + '">Biaya lain</button></div>' +
      (jenis === 'BELI' ? '<label class="lbl" for="kkBarang">Barang</label><select id="kkBarang">' + beli.map(b => '<option value="' + esc(b.kode) + '">' + esc(b.nama + ' (' + b.satuan + ')') + '</option>').join('') + '</select>' +
        '<label class="lbl" for="kkJml">Jumlah</label><input id="kkJml" inputmode="decimal">' : '<div class="hint" style="margin-top:8px;">Galon, es batu, parkir, dll. Tidak menambah stok.</div>') +
      '<label class="lbl" for="kkTotal">Total uang keluar (Rp)</label><input id="kkTotal" inputmode="numeric" class="angkaBesar">' +
      '<label class="lbl" for="kkKet">Keterangan (wajib)</label><input id="kkKet" maxlength="150" placeholder="' + (jenis === 'BELI' ? 'Contoh: thin wall habis, beli toko sebelah' : 'Contoh: beli es batu 2 bal') + '">' +
      (batas ? '<div class="hint" style="margin-top:6px;">Batas per kas keluar ' + rp(batas) + '. Di atas itu harus lewat pusat.</div>' : '') + '<div class="err" id="kkErr"></div>' +
      (beli.length ? '' : '<div class="hint">Belum ada barang yang boleh dibeli cabang (diatur admin di Hub).</div>');
    pasangRupiah($('kkTotal'));
  };
  modal('Kas keluar', '', [{ t: 'Riwayat', c: 'ghost', f: dialogKasRiwayat }, { t: 'Simpan', c: 'merah', f: async () => {
    const total = nilaiRupiah($('kkTotal')), ket = $('kkKet').value.trim(), err = $('kkErr');
    let kode = '', nama = '', satuan = '', jml = '';
    if (jenis === 'BELI') {
      kode = $('kkBarang').value; const b = beli.find(x => x.kode === kode); nama = b.nama; satuan = b.satuan;
      jml = Number(String($('kkJml').value).replace(',', '.'));
      if (!(jml > 0)) { err.textContent = 'Isi jumlah barang.'; return; }
    }
    if (!(total > 0)) { err.textContent = 'Isi total uang keluar.'; return; }
    if (batas && total > batas) { err.textContent = 'Di atas batas ' + rp(batas) + '. Pembelian sebesar ini harus lewat pusat.'; return; }
    if (ket.length < 3) { err.textContent = 'Keterangan wajib diisi.'; return; }
    const k = { id: uuid(), no: nomorBaru('K'), idShift: S.shift.id, idKasir: S.kasir.id, namaKasir: S.kasir.nama, waktu: waktu(), jenis: jenis,
      kodeBarang: kode, namaBarang: nama, satuan: satuan, jumlah: jml, total: total, keterangan: ket };
    S.antrian.kasKeluar.push(k);
    S.kasLokal.unshift(Object.assign({}, k, { status: 'BELUM' })); if (S.kasLokal.length > 300) S.kasLokal.length = 300;
    await Promise.all([simpanKe('antrian'), simpanKe('kasLokal')]);
    tutupModal(); gambarSemua(); tumpuk('Kas keluar ' + rp(total) + ' dicatat. Setoran berkurang ' + rp(total) + '.'); sinkron();
  } }]);
  $('mIsi').onclick = e => { const b = e.target.closest('button[data-j]'); if (!b || b.disabled) return; jenis = b.dataset.j; gambar(); };
  gambar();
}
function dialogKasRiwayat() {
  const l = S.kasLokal.filter(k => S.shift && k.idShift === S.shift.id);
  modal('Kas keluar shift ini', l.length ? '<table class="tbl">' + l.map(k => '<tr><td><b>' + esc(k.jenis === 'BELI' ? k.namaBarang + ' ' + angka(k.jumlah) + ' ' + k.satuan : 'Biaya') + '</b><div class="hint">' +
    esc(k.waktu.slice(11, 16) + ' · ' + k.keterangan + ' · ' + k.namaKasir) + '</div>' + pillStatus(k.status, k.pesan) + (k.pesan ? '<div class="hint" style="color:var(--kuning);">' + esc(k.pesan) + '</div>' : '') +
    '</td><td class="r">' + rp(k.total) + '</td></tr>').join('') + '</table>' : '<div class="kosongInfo">Belum ada kas keluar.</div>', [], null, { luar: true });
}
// ---------- rekap & tutup kasir ----------
function rekapShift() {
  const id = S.shift.id;
  const trx = S.riwayat.filter(t => t.idShift === id);
  const per = {};
  trx.forEach(t => { per[t.metode] = (per[t.metode] || 0) + t.total; });
  const tunai = per.TUNAI || 0, nonTunai = trx.reduce((a, t) => a + t.total, 0) - tunai;
  const kas = S.kasLokal.filter(k => k.idShift === id).reduce((a, k) => a + k.total, 0);
  return { trx: trx, per: per, tunai: tunai, nonTunai: nonTunai, kas: kas, seharusnya: S.shift.modal + tunai - kas };
}
async function dialogTutup() {
  if (!S.shift) { tumpuk('Kasir belum dibuka.'); return; }
  const r = rekapShift();
  modal('Rekap kas & tutup kasir', '<table class="tbl"><tr><td>Dibuka</td><td class="r">' + esc(S.shift.buka.slice(0, 16)) + ' (' + esc(S.shift.namaKasir) + ')</td></tr>' +
    '<tr><td>Modal awal</td><td class="r">' + rp(S.shift.modal) + '</td></tr>' +
    Object.keys(r.per).map(k => '<tr><td>Penjualan ' + esc(namaMetode(k)) + '</td><td class="r">' + rp(r.per[k]) + '</td></tr>').join('') +
    '<tr><td>Kas keluar</td><td class="r">− ' + rp(r.kas) + '</td></tr>' +
    '<tr><td><b>Uang tunai seharusnya di laci</b><div class="hint">modal + penjualan tunai − kas keluar</div></td><td class="r"><b>' + rp(r.seharusnya) + '</b></td></tr></table>' +
    '<div class="hint" style="margin-top:6px;">' + r.trx.length + ' transaksi. Non-tunai ' + rp(r.nonTunai) + ' tidak masuk laci.</div>' +
    '<label class="lbl" for="inSetor">Uang tunai dihitung (setoran)</label><input id="inSetor" inputmode="numeric" class="angkaBesar">' +
    '<div class="angkaBesar" id="selisih" style="font-size:18px; margin-top:8px;"></div>' +
    '<label class="lbl" for="inCatTutup">Catatan (opsional)</label><input id="inCatTutup" maxlength="200"><div class="err" id="ttpErr"></div>',
    [{ t: 'Batal', c: 'ghost', f: tutupModal }, { t: 'Tutup kasir', c: 'merah', id: 'btnTutupKasir', f: async () => {
      if ($('inSetor').value === '') { $('ttpErr').textContent = 'Isi uang tunai yang dihitung.'; return; }
      sibuk(true, 'Mengirim data & menutup kasir...');
      await sinkron(true);
      if (belumTerkirim()) { sibuk(false);
        $('ttpErr').textContent = 'Masih ada ' + belumTerkirim() + ' data belum terkirim (' + (S.gagalSync || 'cek internet') + '). Tutup kasir harus menunggu semua terkirim supaya rekap di Hub cocok.'; return; }
      const r2 = rekapShift(), setor = nilaiRupiah($('inSetor'));
      S.antrian.shift.push({ id: S.shift.id, idKasir: S.shift.idKasir, buka: S.shift.buka, modal: S.shift.modal, tutup: waktu(), tunai: r2.tunai, nonTunai: r2.nonTunai,
        kasKeluar: r2.kas, setoran: setor, jumlahTrx: r2.trx.length, catatan: $('inCatTutup').value.trim() + (S.kasir.id !== S.shift.idKasir ? ' [ditutup ' + S.kasir.nama + ']' : '') });
      await simpanKe('antrian');
      await sinkron(true);
      const sel = setor - r2.seharusnya;
      S.shift = null; await simpanKe('shift');
      sibuk(false); tutupModal();
      modal('Kasir ditutup', '<div class="angkaBesar">' + (sel === 0 ? '✓ Setoran pas' : (sel > 0 ? 'Lebih ' : 'Kurang ') + rp(Math.abs(sel))) + '</div>' +
        '<div class="hint" style="text-align:center; margin-top:8px;">Setoran ' + rp(setor) + ', seharusnya ' + rp(r2.seharusnya) + '.' + (S.antrian.shift.length ? ' Rekap terkirim saat ada internet.' : ' Rekap sudah terkirim ke Hub.') + '</div>',
        [{ t: 'Selesai', f: () => { tutupModal(); bukaPin('Kasir sudah ditutup.'); } }], () => bukaPin('Kasir sudah ditutup.'));
    } }]);
  pasangRupiah($('inSetor'));
  $('inSetor').addEventListener('input', () => {
    const v = nilaiRupiah($('inSetor')), s = v - r.seharusnya, el = $('selisih');
    el.textContent = $('inSetor').value === '' ? '' : s === 0 ? '✓ Pas' : (s > 0 ? 'Lebih ' : 'Kurang ') + rp(Math.abs(s));
    el.style.color = s === 0 ? 'var(--hijau)' : 'var(--merah)';
  });
}
// ---------- atur tampilan (per cabang, disimpan ke server) ----------
function dialogTampilan() {
  const td = JSON.parse(JSON.stringify(tampilanData()));
  td.kategori = kategoriUrut().map(k => k.kode); td.sembunyi = td.sembunyi || [];
  const gambar = () => {
    $('mIsi').innerHTML = '<div class="jd" style="font-weight:700;">Urutan kategori</div>' + td.kategori.map((k, i) => {
      const kat = M().kategori.find(x => x.kode === k); if (!kat) return '';
      return '<div class="opRow"><span class="nm">' + esc(kat.nama) + '</span><span class="step"><button data-u="' + i + '" data-d="-1"' + (i ? '' : ' disabled') + '>↑</button>' +
        '<button data-u="' + i + '" data-d="1"' + (i < td.kategori.length - 1 ? '' : ' disabled') + '>↓</button></span></div>';
    }).join('') +
    '<div class="jd" style="font-weight:700; margin-top:14px;">Tampil di kasir</div><div class="hint">Matikan produk yang tidak dijual di cabang ini.</div>' +
    M().produk.filter(p => p.tampil).map(p => '<label class="opRow"><span class="nm">' + esc(p.nama) + '</span><input type="checkbox" data-s="' + esc(p.kode) + '" style="width:24px; min-height:24px;"' +
      (td.sembunyi.indexOf(p.kode) < 0 ? ' checked' : '') + '></label>').join('') + '<div class="err" id="tpErr"></div>';
  };
  modal('Atur tampilan ' + S.sesi.cabang.nama, '', [{ t: 'Batal', c: 'ghost', f: tutupModal }, { t: 'Simpan', id: 'btnTp', f: async () => {
    sibuk(true, 'Menyimpan tampilan...');
    try {
      const r = await api('simpanTampilan', { tampilan: td, idKasir: S.kasir.id });
      S.master.tampilan = r.tampilan; await simpanKe('master'); sibuk(false); tutupModal(); gambarSemua(); tumpuk(r.pesan, 4000);
    } catch (e) { sibuk(false); $('tpErr').textContent = 'Gagal (' + e.message + '). Atur tampilan butuh internet.'; }
  } }]);
  $('mIsi').onclick = e => {
    const b = e.target.closest('button[data-u]');
    if (b) { const i = Number(b.dataset.u), j = i + Number(b.dataset.d); const t = td.kategori[i]; td.kategori[i] = td.kategori[j]; td.kategori[j] = t; gambar(); }
  };
  $('mIsi').onchange = e => { const c = e.target.closest('input[data-s]'); if (!c) return; const k = c.dataset.s;
    td.sembunyi = td.sembunyi.filter(x => x !== k); if (!c.checked) td.sembunyi.push(k); };
  gambar();
}
// ---------- keluar perangkat ----------
function keluarPerangkat() {
  const n = belumTerkirim() + S.antrian.shift.length;
  if (n) { tumpuk('Masih ada ' + n + ' data belum terkirim. Sync dulu sebelum keluar.', 4000); return; }
  if (S.shift) { tumpuk('Kasir masih terbuka. Tutup kasir dulu.', 4000); return; }
  tanya('Keluar perangkat?', 'Tablet ini harus login lagi dengan akun cabang untuk dipakai.', async () => {
    try { await api('logout', {}); } catch (e) { /* tetap keluar di tablet */ }
    S.sesi.token = ''; S.kasir = null; await simpanKe('sesi'); bukaPasang();
  }, 'Keluar', 'merah');
}

// =====================================================================
// MULAI
// =====================================================================
(async function mulai() {
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  try { await muatSemua(); } catch (e) { alert('Penyimpanan tablet tidak bisa dibuka: ' + e.message); }
  if (!S.sesi || !S.sesi.token) { bukaPasang(belumTerkirim() ? belumTerkirim() + ' data belum terkirim tersimpan di tablet ini. Login lagi untuk mengirimnya.' : ''); return; }
  bukaPin();
  sinkron();
})();
