<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b2a47">
<title>DBASO Kasir</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<style>
  :root { --navy:#1b2a47; --navy2:#24365a; --oranye:#f97316; --biru:#2563eb; --hijau:#16a34a; --merah:#dc2626; --kuning:#b45309;
    --abu:#64748b; --garis:#e2e8f0; --latar:#f1f5f9; --kartu:#ffffff; --teks:#0f172a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--latar); color:var(--teks); font:15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior:none; }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:10px 14px; background:var(--biru); color:#fff; font-weight:600; min-height:44px; }
  button:disabled { opacity:.45; cursor:default; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--garis); }
  button.merah { background:var(--merah); }
  button.hijau { background:var(--hijau); }
  input, select, textarea { font:inherit; width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:10px; background:#fff; min-height:44px; color:var(--teks); }
  label.lbl { display:block; font-size:13px; color:var(--abu); margin:10px 0 4px; font-weight:600; }
  .err { color:var(--merah); font-size:13.5px; min-height:18px; margin-top:6px; white-space:pre-line; }
  .hint { color:var(--abu); font-size:12.5px; }
  .layar { position:fixed; inset:0; display:none; }
  .layar.on { display:flex; }

  /* ---------- pasang perangkat ---------- */
  #lyPasang { align-items:center; justify-content:center; background:var(--navy); padding:16px; overflow:auto; }
  .kotakPasang { background:#fff; border-radius:16px; padding:22px; width:100%; max-width:420px; }
  .kotakPasang h1 { margin:0 0 4px; font-size:20px; }

  /* ---------- PIN ---------- */
  #lyPin { align-items:center; justify-content:center; background:var(--navy); color:#fff; flex-direction:column; gap:14px; padding:16px; }
  #lyPin .cab { font-size:14px; opacity:.8; }
  #lyPin h2 { margin:0; font-size:20px; }
  .titik { display:flex; gap:16px; margin:6px 0; }
  .titik span { width:16px; height:16px; border-radius:50%; border:2px solid #fff; }
  .titik span.isi { background:#fff; }
  .pad { display:grid; grid-template-columns:repeat(3, 76px); gap:12px; }
  .pad button { height:76px; border-radius:50%; font-size:26px; background:var(--navy2); }
  .pad button.kosong { visibility:hidden; }
  #pinPesan { min-height:20px; color:#fecaca; font-size:14px; text-align:center; white-space:pre-line; max-width:440px; }
  #lyPin .bawah { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; justify-content:center; }
  #lyPin .bawah button { background:transparent; border:1px solid rgba(255,255,255,.35); font-weight:500; }

  /* ---------- utama ---------- */
  #lyUtama { flex-direction:column; }
  .bar { height:56px; background:var(--navy); color:#fff; display:flex; align-items:center; gap:8px; padding:0 8px; flex:0 0 auto; }
  .bar button { background:transparent; min-height:44px; padding:8px 10px; }
  .bar .ikon { font-size:22px; width:48px; }
  .bar .namaCab { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:28vw; }
  #stSync { font-size:12.5px; font-weight:500; background:rgba(255,255,255,.1); border-radius:999px; padding:6px 12px; min-height:34px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34vw; }
  #stSync.belum { background:#fde68a; color:#78350f; }
  #stSync.gagal { background:#fecaca; color:#7f1d1d; }
  .bar .isi { flex:1; }
  #btnPrinter { font-size:18px; border:1px solid rgba(255,255,255,.3); padding:6px 10px; }
  #btnPrinter.putus { background:#fecaca; color:#7f1d1d; } #btnPrinter.ok { background:rgba(22,163,74,.35); }
  #btnSimpanan { font-size:13.5px; font-weight:600; border:1px solid rgba(255,255,255,.3); white-space:nowrap; display:flex; align-items:center; gap:2px; }
  .badge { display:inline-block; min-width:20px; padding:0 6px; border-radius:999px; background:var(--oranye); color:#fff; font-size:12px; line-height:20px; text-align:center; margin-left:4px; }

  .badan { flex:1; display:flex; min-height:0; }
  #kat { width:170px; flex:0 0 auto; background:#fff; border-right:1px solid var(--garis); overflow-y:auto; padding:8px; }
  #kat button { display:block; width:100%; text-align:left; background:transparent; color:var(--navy); font-weight:600; margin-bottom:4px; border-radius:10px; padding:12px; }
  #kat button.on { background:var(--navy); color:#fff; }
  .tengah { flex:1; display:flex; flex-direction:column; min-width:0; }
  .cariBar { padding:8px; border-bottom:1px solid var(--garis); background:#fff; }
  #grid { flex:1; overflow-y:auto; padding:10px; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; align-content:start; }
  .prd { background:#fff; border:1px solid var(--garis); border-radius:12px; padding:0; text-align:left; color:var(--teks); min-height:96px; display:flex; flex-direction:column; overflow:hidden; font-weight:500; }
  .prd .warna { height:6px; }
  .prd .nm { padding:10px 10px 4px; font-weight:700; font-size:15px; flex:1; }
  .prd .hg { padding:0 10px 10px; color:var(--navy); font-weight:700; display:flex; justify-content:space-between; align-items:flex-end; gap:6px; }
  .prd .stk { font-size:11.5px; font-weight:600; color:var(--abu); }
  .prd .stk.habis { color:var(--merah); }
  .prd:disabled { opacity:.4; }
  .kosongInfo { grid-column:1/-1; text-align:center; color:var(--abu); padding:40px 10px; }

  #keranjang { width:420px; flex:0 0 auto; background:#fff; border-left:1px solid var(--garis); display:flex; flex-direction:column; min-height:0; }
  .krAtas { display:flex; gap:8px; padding:8px; border-bottom:1px solid var(--garis); }
  .krAtas button { flex:1; }
  #krList { flex:1; overflow-y:auto; }
  .brs { display:flex; gap:10px; padding:10px 12px; border-bottom:1px solid #f1f5f9; background:#fff; width:100%; text-align:left; color:var(--teks); font-weight:400; border-radius:0; }
  .brs .q { font-weight:800; color:var(--navy); min-width:34px; }
  .brs .n { flex:1; }
  .brs .n b { display:block; }
  .brs .n small { display:block; color:var(--abu); }
  .brs .n .cat { display:inline-block; margin-top:3px; background:#fff7ed; color:#9a3412; border:1px solid #fed7aa; border-radius:6px; padding:0 6px; font-size:12px; }
  .brs .r { font-weight:700; white-space:nowrap; }
  .brs.tolak { background:#fef2f2; }
  .krBawah { border-top:1px solid var(--garis); padding:10px 12px; }
  .krBawah .ln { display:flex; justify-content:space-between; margin:2px 0; }
  .krBawah .tot { font-size:20px; font-weight:800; }
  #btnBayar { width:100%; margin-top:8px; font-size:18px; min-height:56px; background:var(--hijau); }
  #btnLihatKr, #btnTutupKr, .tksHp { display:none; }

  /* ---------- modal ---------- */
  .modal { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:12px; }
  .modal.on { display:flex; }
  .mBox { background:#fff; border-radius:16px; width:100%; max-width:560px; max-height:calc(100% - 8px); display:flex; flex-direction:column; overflow:hidden; }
  .mHead { padding:14px 16px; border-bottom:1px solid var(--garis); display:flex; align-items:center; gap:10px; }
  .mHead h3 { margin:0; font-size:17px; flex:1; }
  .mHead .x { background:transparent; color:var(--abu); font-size:24px; padding:4px 10px; }
  .mIsi { padding:14px 16px; overflow-y:auto; flex:1; }
  .mKaki { padding:12px 16px; border-top:1px solid var(--garis); display:flex; gap:10px; }
  .mKaki button { flex:1; }
  .pilih { display:flex; flex-wrap:wrap; gap:8px; }
  .pilih button { background:#fff; color:var(--navy); border:1px solid #cbd5e1; font-weight:600; }
  .pilih button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .grupOp { margin-bottom:14px; }
  .grupOp .jd { font-weight:700; margin-bottom:6px; }
  .opRow { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #f1f5f9; }
  .opRow .nm { flex:1; }
  .step { display:flex; align-items:center; gap:6px; }
  .step button { width:44px; padding:0; background:#fff; color:var(--navy); border:1px solid #cbd5e1; font-size:20px; }
  .step span { min-width:28px; text-align:center; font-weight:700; }
  .angkaBesar { font-size:26px; font-weight:800; text-align:center; }
  .menu { position:fixed; inset:0; z-index:40; display:none; }
  .menu.on { display:block; }
  .menu .tirai { position:absolute; inset:0; background:rgba(15,23,42,.45); }
  .menu .laci { position:absolute; top:0; bottom:0; left:0; width:320px; max-width:86vw; background:#fff; overflow-y:auto; }
  .laci .kepala { background:var(--navy); color:#fff; padding:16px; }
  .laci .kepala b { font-size:17px; }
  .laci .kepala button { width:100%; margin-top:10px; background:var(--oranye); }
  .laci .itm { display:block; width:100%; text-align:left; background:#fff; color:var(--teks); border-radius:0; border-bottom:1px solid #f1f5f9; padding:14px 16px; font-weight:600; }
  .laci .itm small { display:block; font-weight:400; color:var(--abu); }
  .tumpuk { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#0f172a; color:#fff; padding:10px 16px; border-radius:10px; z-index:90; max-width:90vw; font-size:14px; display:none; white-space:pre-line; }
  .tbl { width:100%; border-collapse:collapse; font-size:14px; }
  .tbl td { padding:6px 4px; border-bottom:1px solid #f1f5f9; vertical-align:top; }
  .tbl td.r { text-align:right; white-space:nowrap; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .pill.ok { background:#dcfce7; color:#166534; } .pill.blm { background:#fef3c7; color:#92400e; } .pill.tlk { background:#fee2e2; color:#991b1b; }

  /* ---------- HP (portrait) ---------- */
  @media (max-width: 899px) {
    .bar .namaCab { max-width:30vw; }
    #btnSimpanan .tks { display:none; }
    #btnSimpanan .tksHp, #btnTutupKr { display:inline; }
    #btnTutupKr { display:block; }
    .badan { flex-direction:column; }
    #kat { width:auto; display:flex; gap:6px; overflow-x:auto; overflow-y:hidden; border-right:0; border-bottom:1px solid var(--garis); padding:6px 8px; flex:0 0 auto; }
    #kat button { width:auto; white-space:nowrap; margin:0; padding:8px 14px; }
    #grid { grid-template-columns:repeat(2, minmax(0,1fr)); padding-bottom:84px; }
    #keranjang { position:fixed; inset:56px 0 0 0; width:auto; z-index:30; display:none; border-left:0; }
    #keranjang.on { display:flex; }
    #btnLihatKr { display:flex; position:fixed; left:10px; right:10px; bottom:10px; z-index:20; min-height:56px; justify-content:space-between; align-items:center; background:var(--hijau); font-size:16px; }
  }
  @media (min-width: 900px) and (max-width: 1150px) { #keranjang { width:360px; } #kat { width:140px; } }
</style>
</head>
<body>

<!-- ================= PASANG PERANGKAT ================= -->
<div class="layar" id="lyPasang">
  <div class="kotakPasang">
    <h1>Pasang tablet kasir</h1>
    <div class="hint">Login <b>sekali</b> pakai akun cabang dari Hub DBASO. Setelah itu kasir masuk dengan PIN.</div>
    <div id="pasangInfo" class="err" style="color:var(--kuning);"></div>
    <div id="boxServer">
      <label class="lbl" for="inServer">Alamat server (Hub › Fungsi POS › Perangkat Kasir)</label>
      <input id="inServer" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
    </div>
    <label class="lbl" for="inUser">Username akun cabang</label>
    <input id="inUser" autocomplete="username" autocapitalize="none">
    <label class="lbl" for="inPass">Password</label>
    <input id="inPass" type="password" autocomplete="current-password">
    <label class="lbl" for="inNamaDev">Nama perangkat</label>
    <input id="inNamaDev" placeholder="Contoh: Tablet depan" maxlength="40">
    <div id="boxCabAdmin" style="display:none;">
      <label class="lbl" for="inCabAdmin">Kode cabang (khusus akun admin, untuk uji)</label>
      <input id="inCabAdmin" placeholder="MGS" maxlength="10" autocapitalize="characters">
    </div>
    <div class="err" id="pasangErr"></div>
    <button id="btnPasang" style="width:100%; margin-top:10px;">Pasang</button>
  </div>
</div>

<!-- ================= PIN ================= -->
<div class="layar" id="lyPin">
  <div class="cab" id="pinCab"></div>
  <h2 id="pinJudul">Masukkan PIN kasir</h2>
  <div class="titik" id="pinTitik"><span></span><span></span><span></span><span></span></div>
  <div id="pinPesan"></div>
  <div class="pad" id="pinPad"></div>
  <div class="bawah">
    <button id="pinSync">⟳ Sync data kasir</button>
    <button id="pinKeluar">Keluar perangkat</button>
  </div>
</div>

<!-- ================= UTAMA ================= -->
<div class="layar" id="lyUtama">
  <div class="bar">
    <button class="ikon" id="btnMenu" aria-label="Menu">☰</button>
    <span class="namaCab" id="barCab"></span>
    <button id="stSync" title="Tekan untuk sync"></button>
    <span class="isi"></span>
    <button id="btnPrinter" title="Printer">🖨</button>
    <button id="btnSimpanan"><span class="tks">Keranjang Tersimpan</span><span class="tksHp">🗂</span><span class="badge" id="bdSimpanan">0</span></button>
    <button class="ikon" id="btnTitik" aria-label="Lainnya">⋮</button>
  </div>
  <div class="badan">
    <div id="kat"></div>
    <div class="tengah">
      <div class="cariBar"><input id="inCari" placeholder="Cari produk..." autocomplete="off"></div>
      <div id="grid"></div>
    </div>
    <div id="keranjang">
      <button class="ghost" id="btnTutupKr" style="border-radius:0; border-width:0 0 1px 0; text-align:left;">‹ Kembali ke produk</button>
      <div class="krAtas">
        <button class="ghost" id="btnTipe">Toko ▾</button>
        <button class="ghost" id="btnPelanggan">+ Pelanggan</button>
      </div>
      <div id="krList"></div>
      <div class="krBawah">
        <div class="ln"><span>Subtotal</span><span id="krSub">Rp 0</span></div>
        <div class="ln" id="krDiskonLn" style="display:none; color:var(--merah);"><span id="krDiskonLbl">Diskon</span><span id="krDiskon"></span></div>
        <div class="ln tot"><span>Total</span><span id="krTot">Rp 0</span></div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="ghost" id="btnSimpan" style="flex:1;">Simpan</button>
          <button class="ghost" id="btnHapusKr" style="flex:1;">Kosongkan</button>
        </div>
        <button id="btnBayar">Bayar</button>
      </div>
    </div>
  </div>
  <button id="btnLihatKr"><span id="lkJml">0 item</span><span id="lkTot">Rp 0</span></button>
</div>

<!-- ================= MENU ☰ ================= -->
<div class="menu" id="menu">
  <div class="tirai" id="menuTirai"></div>
  <div class="laci">
    <div class="kepala">
      <b id="mCab"></b>
      <div class="hint" style="color:#cbd5e1;" id="mInfo"></div>
      <button id="mSync">⟳ SYNC DATA</button>
    </div>
    <button class="itm" data-m="baru">🧾 Transaksi Baru</button>
    <button class="itm" data-m="riwayat">📜 Riwayat Transaksi</button>
    <button class="itm" data-m="kas">💸 Kas Keluar<small>Beli barang di cabang / biaya lain</small></button>
    <button class="itm" data-m="tutup">🔒 Rekap Kas &amp; Tutup Kasir</button>
    <button class="itm" data-m="tampilan">🎨 Atur Tampilan<small>Urutan kategori, urutan produk, sembunyikan produk</small></button>
    <button class="itm" data-m="printer">🖨 Pengaturan Printer<small>Struk pembeli & tiket dapur (Bluetooth)</small></button>
    <button class="itm" data-m="stok">📦 Hitung Stok Harian<small>Wajib sebelum tutup kasir</small></button>
    <button class="itm" data-m="serah">🤝 Serah Terima Kasir<small>Ganti orang: hitung uang laci</small></button>
    <button class="itm" data-m="keluar" style="color:var(--merah);">⏏ Keluar Perangkat</button>
    <div class="hint" style="padding:12px 16px;" id="mVersi"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="mBox"><div class="mHead"><h3 id="mJudul"></h3><button class="x" id="mTutup" aria-label="Tutup">×</button></div>
  <div class="mIsi" id="mIsi"></div><div class="mKaki" id="mKaki"></div></div></div>
<div class="tumpuk" id="tumpuk"></div>

<script>
'use strict';
const VERSI_APP = '1.4 (28 Nov 2026)';
// =====================================================================
// PENYIMPANAN DI TABLET (IndexedDB, kunci -> nilai)
// =====================================================================
const DB = (() => {
  let dbp = null;
  const buka = () => dbp || (dbp = new Promise((ok, no) => {
    const r = indexedDB.open('dbaso-kasir', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  }));
  const tx = async (mode, f) => { const db = await buka(); return new Promise((ok, no) => {
    const t = db.transaction('kv', mode); const s = t.objectStore('kv'); const req = f(s);
    t.oncomplete = () => ok(req && req.result); t.onerror = () => no(t.error); t.onabort = () => no(t.error); }); };
  return { get: k => tx('readonly', s => s.get(k)), set: (k, v) => tx('readwrite', s => s.put(v, k)), del: k => tx('readwrite', s => s.delete(k)) };
})();

// =====================================================================
// KEADAAN
// =====================================================================
const S = {
  sesi: null,        // { server, token, idPerangkat, kodePerangkat, cabang:{kode,nama}, akun }
  master: null,      // hasil sync
  syncJam: '',       // jam sync terakhir berhasil
  kasir: null,       // { id, nama } yang sedang aktif (tidak disimpan: setiap buka aplikasi minta PIN)
  shift: null,       // { id, idKasir, namaKasir, buka, modal }
  antrian: { transaksi: [], kasKeluar: [], shift: [], serahTerima: [] },
  stokDraft: null,
  printer: [],       // printer Bluetooth perangkat ini: [{ id, nama, devId, lebar, nota, salinan, tiket, judul, kategori: ['*'] | [kode] }]   // { idShift, item: { kode: { kotak: [..], waktu } } } hitung stok harian (draft)
  riwayat: [],       // transaksi perangkat ini (terbaru dulu, maks 600)
  kasLokal: [],      // kas keluar perangkat ini (maks 300)
  simpanan: [],      // keranjang tersimpan
  seq: {},           // nomor urut per tanggal
  kr: null,          // keranjang aktif
  katAktif: '',
  sedangSync: false, gagalSync: '',
  terakhirSentuh: Date.now(),
  pinSalah: 0, pinKunciSampai: 0
};
const simpanKe = (k) => DB.set(k, S[k]);
async function muatSemua() {
  for (const k of ['sesi', 'master', 'syncJam', 'shift', 'antrian', 'riwayat', 'kasLokal', 'simpanan', 'seq', 'stokDraft', 'printer']) {
    const v = await DB.get(k);
    if (v !== undefined) S[k] = v;
  }
  S.antrian = Object.assign({ transaksi: [], kasKeluar: [], shift: [], serahTerima: [] }, S.antrian || {});
  if (S.shift && !S.shift.segmen) S.shift.segmen = { no: 1, idKasir: S.shift.idKasir, nama: S.shift.namaKasir, mulai: S.shift.buka, uangAwal: S.shift.modal };   // shift versi lama
  S.kr = (await DB.get('kr')) || krBaru();
}
function krBaru() { return { tipe: 'TOKO', pelanggan: '', item: [], diskon: null }; }
const simpanKr = () => DB.set('kr', S.kr);

// =====================================================================
// ALAT BANTU
// =====================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
const angka = n => Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: 3 });
const p2 = n => String(n).padStart(2, '0');
function waktu(d) { d = d || new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); }
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
let tTumpuk = 0;

async function api(aksi, data, token) {
  const server = (S.sesi && S.sesi.server) || '';
  if (!navigator.onLine) throw Object.assign(new Error('Tidak ada internet.'), { offline: true });
  let r;
  try {
    r = await fetch(server, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ aksi: aksi, token: token === undefined ? (S.sesi && S.sesi.token) : token, data: data || {} }) });
  } catch (e) { throw Object.assign(new Error('Server tidak bisa dihubungi (sinyal lemah?).'), { offline: true }); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Balasan server tidak terbaca. Cek alamat server (harus berakhiran /exec).'); }
  if (!j.ok) throw Object.assign(new Error(j.pesan || 'Gagal.'), { kode: j.kode });
  return j;
}

function stokSisa() {
  const s = {};

  S.antrian.transaksi.forEach(t => t.item.forEach(it => {
    (it.potong || []).forEach(b => { s[b.kode] = (s[b.kode] || 0) - b.jumlah * it.jumlah; });
    (it.opsi || []).forEach(o => (o.potong || []).forEach(b => { s[b.kode] = (s[b.kode] || 0) - b.jumlah * it.jumlah; }));
  }));
  S.antrian.kasKeluar.forEach(k => { if (k.jenis === 'BELI') s[k.kodeBarang] = (s[k.kodeBarang] || 0) + Number(k.jumlah); });

}

  const s = {};

    (it.potong || []).forEach(b => { s[b.kode] = (s[b.kode] || 0) + b.jumlah * it.jumlah; });
    (it.opsi || []).forEach(o => (o.potong || []).forEach(b => { s[b.kode] = (s[b.kode] || 0) + b.jumlah * it.jumlah; })); });

    if (ada < perlu[k] - 1e-9) kurang.push((M().stok[k] ? M().stok[k].nama : k) + ' (sisa ' + angka(Math.max(0, ada)) + ')');

  if (kurang.length) tumpuk('⚠ Stok kurang: ' + kurang.join(', ') + '. Tetap dijual.', 3500);

// =====================================================================
// baris: { kode, nama, jumlah, pilihan: [{grup, no, n}], catatan, potong }
function sigPilihan(pl) { return pl.map(x => x.grup + '#' + x.no + 'x' + x.n).sort().join(','); }
function opsiBaris(it, tipe) {

  (it.pilihan || []).forEach(x => {
    const g = p ? p.opsi.find(y => y.kode === x.grup) : null;
    const o = g ? g.item.find(y => y.no === x.no) : null;
    const nama = o ? o.nama : x.nama, harga = o ? hargaOpsi(o, tipe) : x.harga || 0, potong = o ? o.potong.map(b => ({ kode: b.kode, jumlah: b.jumlah })) : (x.potong || []);
    for (let i = 0; i < x.n; i++) out.push({ grup: x.grup, nama: nama, harga: harga, potong: potong });
  });
  return out;
}
function hitungBaris(it, tipe) {

  const hp = p ? hargaProduk(p, tipe) : it.hargaProduk;
  const opsi = opsiBaris(it, tipe);
  const ho = opsi.reduce((a, o) => a + o.harga, 0);
  return { tolak: hp === null, hargaProduk: hp || 0, opsi: opsi, hargaSatuan: (hp || 0) + ho, subtotal: ((hp || 0) + ho) * it.jumlah };
}

  let dsk = 0;
  const d = S.kr.diskon;
  if (d) dsk = d.jenis === 'PERSEN' ? Math.round(sub * d.nilai / 100) : Math.min(d.nilai, sub);
  return { brs: brs, sub: sub, diskon: dsk, total: sub - dsk, tolak: tolak };
}
function teksPilihan(it) {
  const p = produkMap()[it.kode];
  return (it.pilihan || []).map(x => { const g = p && p.opsi.find(y => y.kode === x.grup); const o = g && g.item.find(y => y.no === x.no); return (o ? o.nama : x.nama || '?') + (x.n > 1 ? ' ×' + x.n : ''); }).join(', ');
}
function gambarKeranjang() {
  const h = hitungKr();
  $('btnTipe').textContent = namaTipe(S.kr.tipe) + ' ▾';
  $('btnPelanggan').textContent = S.kr.pelanggan ? '👤 ' + S.kr.pelanggan : '+ Pelanggan';
  $('krList').innerHTML = S.kr.item.length ? S.kr.item.map((it, i) => {
    const b = h.brs[i], tp = teksPilihan(it);
    return '<button class="brs' + (b.tolak ? ' tolak' : '') + '" data-i="' + i + '"><span class="q">' + it.jumlah + '×</span><span class="n"><b>' + esc(it.nama) + '</b>' +
      (tp ? '<small>' + esc(tp) + '</small>' : '') + (it.catatan ? '<span class="cat">' + esc(it.catatan) + '</span>' : '') +

      '</span><span class="r">' + rp(b.subtotal) + '</span></button>';
  }).join('') : '<div class="kosongInfo">Keranjang kosong.<br>Tap produk untuk menambah.</div>';
  $('krSub').textContent = rp(h.sub);
  $('krDiskonLn').style.display = h.diskon ? '' : 'none';
  if (S.kr.diskon) { $('krDiskonLbl').textContent = 'Diskon ' + (S.kr.diskon.jenis === 'PERSEN' ? S.kr.diskon.nilai + '% ' : '') + '(' + S.kr.diskon.namaAlasan + ')'; $('krDiskon').textContent = '− ' + rp(h.diskon); }
  $('krTot').textContent = rp(h.total);

}
function tambahBaris(baru) {
  const sig = sigPilihan(baru.pilihan);
  const ada = S.kr.item.find(x => x.kode === baru.kode && !x.catatan && !baru.catatan && sigPilihan(x.pilihan) === sig);
  if (ada) ada.jumlah += baru.jumlah; else S.kr.item.push(baru);
  simpanKr(); gambarKeranjang(); gambarGrid();
}
function tapProduk(kode) {
  const p = produkMap()[kode];
  if (!p) return;
  if (p.opsi.length) { dialogOpsi(p); return; }
  cekStokPeringatan(p.potong, 1);
  tambahBaris({ kode: p.kode, nama: p.nama, jumlah: 1, pilihan: [], catatan: '', potong: p.potong.map(b => ({ kode: b.kode, jumlah: b.jumlah })) });
}

function dialogOpsi(p, edit) {
  const pil = {};   // grup -> { no: n }
  (edit ? edit.pilihan : []).forEach(x => { (pil[x.grup] = pil[x.grup] || {})[x.no] = x.n; });
  let jumlah = edit ? edit.jumlah : 1;
  const gambar = () => {
    let html = '';
    p.opsi.forEach(g => {
      const isi = pil[g.kode] || {}, tot = Object.values(isi).reduce((a, b) => a + b, 0);
      html += '<div class="grupOp"><div class="jd">' + esc(g.nama) + ' <span class="hint">' + (g.wajib ? 'wajib' : 'opsional') +
        (g.multi ? (g.maks ? ', maks ' + g.maks : ', boleh lebih dari satu') : ', pilih satu') + '</span></div>';
      g.item.forEach(o => {
        const n = isi[o.no] || 0, h = hargaOpsi(o, S.kr.tipe);
        html += '<div class="opRow"><span class="nm">' + esc(o.nama) + ' <span class="hint">' + (h ? '+' + rp(h) : 'gratis') + '</span></span>' +
          (g.multi ? '<span class="step"><button data-g="' + esc(g.kode) + '" data-o="' + o.no + '" data-d="-1">−</button><span>' + n + '</span><button data-g="' + esc(g.kode) + '" data-o="' + o.no + '" data-d="1"' + (g.maks && tot >= g.maks ? ' disabled' : '') + '>+</button></span>'
            : '<span class="pilih"><button data-g="' + esc(g.kode) + '" data-o="' + o.no + '" data-d="pilih" class="' + (n ? 'on' : '') + '">' + (n ? '✓ Dipilih' : 'Pilih') + '</button></span>') + '</div>';
      });
      html += '</div>';
    });
    const pilihan = kumpulPilihan();
    const tmp = { kode: p.kode, pilihan: pilihan, jumlah: jumlah };
    const hb = hitungBaris(tmp, S.kr.tipe);
    html += '<div class="opRow" style="border:0;"><span class="nm"><b>Jumlah</b></span><span class="step"><button data-j="-1">−</button><span>' + jumlah + '</span><button data-j="1">+</button></span></div>' +
      '<div class="angkaBesar" style="margin-top:6px;">' + rp(hb.subtotal) + '</div>';
    $('mIsi').innerHTML = html;
  };
  const kumpulPilihan = () => {
    const out = [];
    p.opsi.forEach(g => Object.keys(pil[g.kode] || {}).forEach(no => { const n = pil[g.kode][no]; if (n > 0) out.push({ grup: g.kode, no: Number(no), n: n }); }));
    return out;
  };
  modal(p.nama, '', [{ t: 'Batal', c: 'ghost', f: tutupModal }, { t: edit ? 'Simpan' : 'Tambah', c: 'hijau', f: () => {
    for (const g of p.opsi) {
      const tot = Object.values(pil[g.kode] || {}).reduce((a, b) => a + b, 0);
      if (g.wajib && !tot) { tumpuk('Pilih ' + g.nama + ' dulu.'); return; }
    }
    const pilihan = kumpulPilihan();
    const potong = p.potong.map(b => ({ kode: b.kode, jumlah: b.jumlah }));
    const semua = potong.concat(opsiBaris({ kode: p.kode, pilihan: pilihan }, S.kr.tipe).reduce((a, o) => a.concat(o.potong), []));
    tutupModal();
    if (edit) { edit.pilihan = pilihan; edit.jumlah = jumlah; simpanKr(); gambarKeranjang(); gambarGrid(); return; }
    cekStokPeringatan(semua, jumlah);
    tambahBaris({ kode: p.kode, nama: p.nama, jumlah: jumlah, pilihan: pilihan, catatan: '', potong: potong });
  } }]);
  $('mIsi').onclick = e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.j) { jumlah = Math.max(1, jumlah + Number(b.dataset.j)); gambar(); return; }
    const g = p.opsi.find(x => x.kode === b.dataset.g); if (!g) return;
    const no = Number(b.dataset.o), isi = pil[g.kode] = pil[g.kode] || {};
    if (b.dataset.d === 'pilih') { const sudah = isi[no]; pil[g.kode] = {}; if (!sudah) pil[g.kode][no] = 1; }
    else isi[no] = Math.max(0, (isi[no] || 0) + Number(b.dataset.d));
    gambar();
  };
  gambar();
}

function dialogBaris(i) {
  const it = S.kr.item[i];
  const p = produkMap()[it.kode];
  let jml = it.jumlah, ambil = it.jumlah, cat = it.catatan || '';
  const cepat = p ? p.catatan : [];

    $('mIsi').innerHTML =
      '<div class="opRow"><span class="nm"><b>Jumlah</b></span><span class="step"><button data-a="j-">−</button><span>' + jml + '</span><button data-a="j+">+</button></span></div>' +
      '<label class="lbl">Catatan (dicetak di tiket dapur)</label>' +
      (cepat.length ? '<div class="pilih" style="margin-bottom:8px;">' + cepat.map(c => '<button data-c="' + esc(c) + '" class="' + (cat === c ? 'on' : '') + '">' + esc(c) + '</button>').join('') + '</div>' : '') +
      '<input id="inCat" maxlength="60" placeholder="Tulis catatan..." value="' + esc(cat) + '">' +
      (jml > 1 ? '<div class="hint" style="margin-top:10px;">Catatan hanya untuk sebagian? Contoh: 5 dari 10 "tanpa kuah".</div>' +
        '<div class="opRow"><span class="nm">Catatan untuk</span><span class="step"><button data-a="a-">−</button><span>' + ambil + '</span><button data-a="a+">+</button></span><span class="hint">dari ' + jml + '</span></div>' : '') +
      (p && p.opsi.length ? '<button class="ghost" data-a="opsi" style="width:100%; margin-top:10px;">Ubah pilihan (' + esc(teksPilihan(it) || 'belum ada') + ')</button>' : '');
  };
  modal(it.nama, '', [{ t: 'Hapus', c: 'merah', f: () => { S.kr.item.splice(i, 1); simpanKr(); tutupModal(); gambarKeranjang(); gambarGrid(); } },
    { t: 'Simpan', c: 'hijau', f: () => {
      cat = $('inCat').value.trim();
      if (cat && ambil < jml) {   // pecah baris: sebagian dengan catatan
        it.jumlah = jml - ambil;
        S.kr.item.splice(i + 1, 0, Object.assign({}, it, { jumlah: ambil, catatan: cat, pilihan: it.pilihan.slice() }));
      } else { it.jumlah = jml; it.catatan = cat; }
      if (!cat) {   // tanpa catatan: gabung dengan baris kembar
        const kembar = S.kr.item.find(x => x !== it && x.kode === it.kode && !x.catatan && sigPilihan(x.pilihan) === sigPilihan(it.pilihan));
        if (kembar) { kembar.jumlah += it.jumlah; S.kr.item.splice(S.kr.item.indexOf(it), 1); }
      }
      simpanKr(); tutupModal(); gambarKeranjang(); gambarGrid();
    } }]);
  $('mIsi').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const inp = $('inCat'); if (inp) cat = inp.value;
    if (b.dataset.c !== undefined) { cat = cat === b.dataset.c ? '' : b.dataset.c; }
    else if (b.dataset.a === 'j-') { jml = Math.max(1, jml - 1); ambil = Math.min(ambil, jml); }
    else if (b.dataset.a === 'j+') { jml++; if (ambil === jml - 1 && !it.catatan) ambil = jml; }
    else if (b.dataset.a === 'a-') ambil = Math.max(1, ambil - 1);
    else if (b.dataset.a === 'a+') ambil = Math.min(jml, ambil + 1);
    else if (b.dataset.a === 'opsi') { tutupModal(); dialogOpsi(p, it); return; }
    gambar();
  };
  gambar();
}

  simpanKe('seq');
  return S.sesi.cabang.kode + '-' + S.sesi.kodePerangkat + '-' + tgl + '-' + (akhiran || '') + String(S.seq[k]).padStart(akhiran ? 3 : 4, '0');
}

// PRINTER BLUETOOTH (ESC/POS, 58/80 mm) - struk pembeli + tiket dapur per kategori
// Tes 28 Nov: printer RPP02N, Android 10 + Chrome 123 -> layanan 18f0 / karakteristik 2af1 (writeWithoutResponse).
// =====================================================================
const PRN_LAYANAN = ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '49535343-fe7d-4ae5-8fa9-9fafd205e455',
  '0000ff00-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '0000ae30-0000-1000-8000-00805f9b34fb',
  '0000fee7-0000-1000-8000-00805f9b34fb', '0000ff12-0000-1000-8000-00805f9b34fb', '0000ae00-0000-1000-8000-00805f9b34fb'];
const PRN = {};   // id -> { dev, ch, nr, antre: Promise }
function prnTersambung(p) { const x = PRN[p.id]; return !!(x && x.ch && x.dev && x.dev.gatt && x.dev.gatt.connected); }
function gambarPrinter() {
  const b = $('btnPrinter'); if (!b) return;
  const n = S.printer.length, putus = S.printer.filter(p => !prnTersambung(p)).length;
  b.className = !n ? '' : putus ? 'putus' : 'ok';
  b.textContent = !n ? '🖨' : putus ? '🖨 ' + putus + ' putus' : '🖨 ✓';
}
async function prnCariJalur(dev) {
  const gatt = await dev.gatt.connect();
  for (const uuid of PRN_LAYANAN) {
    let svc; try { svc = await gatt.getPrimaryService(uuid); } catch (e) { continue; }
    for (const ch of await svc.getCharacteristics()) if (ch.properties.write || ch.properties.writeWithoutResponse) return { ch: ch, nr: !!ch.properties.writeWithoutResponse };
  }
  throw new Error('Printer tidak punya jalur cetak yang dikenal.');
}
function prnPasangDev(p, dev) {
  PRN[p.id] = PRN[p.id] || { antre: Promise.resolve() };
  if (PRN[p.id].dev !== dev) dev.addEventListener('gattserverdisconnected', () => { if (PRN[p.id]) PRN[p.id].ch = null; gambarPrinter(); });
  PRN[p.id].dev = dev;
}
// sambung: pakai perangkat yang sudah dikenal (tanpa memilih lagi); pilih = true -> tampilkan daftar Bluetooth (harus dari tombol)
async function sambungPrinter(p, pilih) {
  if (!navigator.bluetooth) throw new Error('Chrome ini tidak mendukung Bluetooth.');
  let dev = PRN[p.id] && PRN[p.id].dev;
  if (!dev && !pilih && navigator.bluetooth.getDevices) { try { dev = (await navigator.bluetooth.getDevices()).find(d => d.id === p.devId); } catch (e) { /* tidak didukung */ } }
  if (!dev) {
    if (!pilih) throw new Error('perlu dipilih ulang');
    dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: PRN_LAYANAN });
    p.devId = dev.id; if (!p.nama || p.nama === 'Printer') p.nama = dev.name || 'Printer'; await simpanKe('printer');
  }
  prnPasangDev(p, dev);
  const j = await prnCariJalur(dev);
  PRN[p.id].ch = j.ch; PRN[p.id].nr = j.nr;
  gambarPrinter();
}
async function autoSambungPrinter() { for (const p of S.printer) if (!prnTersambung(p)) { try { await sambungPrinter(p, false); } catch (e) { /* tunggu kasir tekan 🖨 */ } } gambarPrinter(); }
// kirim byte ke 1 printer (berurutan per printer, potongan 100 byte)
function kirimPrinter(p, data) {
  PRN[p.id] = PRN[p.id] || { antre: Promise.resolve() };
  const job = PRN[p.id].antre.then(async () => {
    if (!prnTersambung(p)) await sambungPrinter(p, false);
    const x = PRN[p.id];
    for (let i = 0; i < data.length; i += 100) {
      const pot = data.slice(i, i + 100);
      if (x.nr) await x.ch.writeValueWithoutResponse(pot); else await x.ch.writeValueWithResponse(pot);
      await new Promise(r => setTimeout(r, 25));
    }
  });
  PRN[p.id].antre = job.catch(() => {});
  return job;
}

// ---- penyusun ESC/POS ----
function Esc(lebar) {
  const B = [], L = lebar || 32;
  const asc = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[×]/g, 'x').replace(/[−–—]/g, '-');
  const teks = s => { for (const ch of asc(s)) B.push(ch.charCodeAt(0) < 128 ? ch.charCodeAt(0) : 63); };
  const o = {
    L: L, b: (...x) => { B.push(...x); return o; }, teks: s => { teks(s); return o; },
    ln: s => { teks((s || '') + '\n'); return o; },
    tengah: on => o.b(0x1b, 0x61, on ? 1 : 0), tebal: on => o.b(0x1b, 0x45, on ? 1 : 0), balik: on => o.b(0x1d, 0x42, on ? 1 : 0),
    ukuran: (w, h) => o.b(0x1d, 0x21, ((w ? 1 : 0) << 4) | (h ? 1 : 0)),
    garis: () => o.ln('-'.repeat(L)),
    // pecah teks panjang jadi beberapa baris selebar n
    pecah: (s, n) => { const out = []; let cur = ''; asc(s).split(' ').forEach(w => { while (w.length > n) { if (cur) { out.push(cur); cur = ''; } out.push(w.slice(0, n)); w = w.slice(n); } if (!cur) cur = w; else if ((cur + ' ' + w).length <= n) cur += ' ' + w; else { out.push(cur); cur = w; } }); if (cur) out.push(cur); return out.length ? out : ['']; },
    // kiri ... kanan (harga rata kanan); kiri panjang dipecah, harga di baris terakhir
    baris: (kiri, kanan, indent) => {
      kanan = asc(kanan || ''); const pre = indent || '', lk = L - kanan.length - 1;
      const l = o.pecah(kiri, lk - pre.length);
      l.forEach((x, i) => { const z = (i ? pre : '') + x; o.ln(i === l.length - 1 ? z.padEnd(lk) + ' ' + kanan : z); });
      return o;
    },
    sisip: (s, pre) => { o.pecah(s, L - pre.length).forEach(x => o.ln(pre + x)); return o; },
    akhir: () => o.b(0x1b, 0x64, 4),   // dorong kertas 4 baris supaya tidak tersobek
    bytes: () => new Uint8Array(B)
  };
  return o.b(0x1b, 0x40);
}
const angkaRp = n => Math.round(Number(n) || 0).toLocaleString('id-ID');
function tglStruk(w) { return w.slice(8, 10) + '/' + w.slice(5, 7) + '/' + w.slice(0, 4) + ' ' + w.slice(11, 16); }
function bytesNota(t, p) {
  const e = Esc(p.lebar), st = M().struk || { kepala: ['DBASO ETAM', S.sesi.cabang.nama], kaki: ['Terima kasih'] };
  e.tengah(1);
  (st.kepala || []).forEach((x, i) => { if (i === 0) e.ukuran(1, 1).ln(x).ukuran(0, 0); else e.ln(x); });
  e.tengah(0).garis().ln(t.no).ln(tglStruk(t.waktu) + '  Kasir: ' + t.namaKasir);
  if (t.tipe !== 'TOKO') e.tebal(1).ln(namaTipe(t.tipe).toUpperCase()).tebal(0);
  if (t.pelanggan) e.ln('Pelanggan: ' + t.pelanggan);
  e.garis();
  t.item.forEach(it => {
    e.baris(it.jumlah + 'x ' + it.nama, angkaRp(it.subtotal), '   ');
    if (it.opsi && it.opsi.length) e.sisip(ringkasOpsi(it.opsi), '   ');
    if (it.catatan) e.sisip('* ' + it.catatan, '   ');
  });

  if (t.diskon && t.diskon.rp) { e.baris('Subtotal', angkaRp(t.subtotal)); e.baris('Diskon' + (t.diskon.jenis === 'PERSEN' ? ' ' + t.diskon.nilai + '%' : ''), '-' + angkaRp(t.diskon.rp)); }
  e.tebal(1).baris('TOTAL', angkaRp(t.total)).tebal(0);
  e.baris(namaMetode(t.metode), angkaRp(t.dibayar));
  if (t.metode === 'TUNAI') e.baris('Kembali', angkaRp(t.kembali));
  e.garis().tengah(1);

}
function bytesTiket(t, p, items, judul) {
  const e = Esc(p.lebar);
  e.tengah(1).ukuran(1, 1).ln(judul || 'DAPUR').ukuran(0, 0);
  e.tebal(1).ukuran(0, 1).ln(namaTipe(t.tipe).toUpperCase() + (t.pelanggan ? ' - ' + t.pelanggan : '')).ukuran(0, 0).tebal(0);
  e.ln(t.no.split('-').slice(-1)[0] + '  ' + t.waktu.slice(11, 16) + '  ' + t.namaKasir).tengah(0).garis();
  items.forEach(it => {
    e.ukuran(0, 1).tebal(1); e.pecah(it.jumlah + 'x ' + it.nama, e.L).forEach(x => e.ln(x)); e.tebal(0).ukuran(0, 0);

// Kategori yang tidak dipegang printer mana pun -> ikut tiket di printer nota pertama.
function rencanaCetak(t, jenis) {
  const pm = produkMap(), out = [];
  const tiketP = S.printer.filter(p => p.tiket && (p.kategori || []).length);
  const notaP = S.printer.filter(p => p.nota);
  const per = {};
  t.item.forEach(it => {
    const kat = pm[it.kode] ? pm[it.kode].kategori : '';
    let tuju = tiketP.filter(p => p.kategori.indexOf('*') > -1 || p.kategori.indexOf(kat) > -1);
    if (!tuju.length && (notaP[0] || S.printer[0])) tuju = [notaP[0] || S.printer[0]];
    tuju.forEach(p => { (per[p.id] = per[p.id] || []).push(it); });
  });
  S.printer.forEach(p => {
    const bag = [];
    if (p.nota && jenis !== 'tiket') for (let i = 0; i < (p.salinan || 1); i++) bag.push(bytesNota(t, p));
    if (per[p.id] && jenis !== 'nota') bag.push(bytesTiket(t, p, per[p.id], p.judul));
    if (bag.length) { const n = bag.reduce((a, x) => a + x.length, 0), all = new Uint8Array(n); let o = 0; bag.forEach(x => { all.set(x, o); o += x.length; }); out.push({ p: p, data: all }); }

async function sinkron(paksa) {
  if (!S.sesi || !S.sesi.token || S.sedangSync) return;
  if (!navigator.onLine) { S.gagalSync = 'offline'; gambarSyncAman(); return; }
  S.sedangSync = true; S.gagalSync = ''; gambarSyncAman();
  try {
    // 1) kirim data yang belum terkirim, maks 50 per kiriman
    for (let putaran = 0; putaran < 20; putaran++) {
      const trx = S.antrian.transaksi.slice(0, 50);
      const kas = S.antrian.kasKeluar.slice(0, 50 - trx.length);
      const shf = S.antrian.shift.slice(0, 20);
      const srh = S.antrian.serahTerima.slice(0, 30);
      if (!trx.length && !kas.length && !shf.length && !srh.length) break;
      const r = await api('kirim', { transaksi: trx, kasKeluar: kas, shift: shf, serahTerima: srh });
      const okSrh = {}; (r.serahTerima || []).forEach(x => { okSrh[x.id] = x; });
      S.antrian.serahTerima = S.antrian.serahTerima.filter(x => !okSrh[x.id]);
      (r.serahTerima || []).filter(x => x.status === 'DITOLAK').forEach(x => tumpuk('⚠ Serah terima ditolak server: ' + x.pesan, 6000));
      const beres = (list, res, riwayat) => {
        const st = {}; (res || []).forEach(x => { st[x.id] = x; });
        list.forEach(x => {
          const h = st[x.id]; if (!h) return;
          const ri = riwayat ? riwayat.find(y => y.id === x.id) : null;
          if (ri) { ri.status = h.status === 'DITOLAK' ? 'DITOLAK' : 'TERKIRIM'; ri.pesan = h.pesan || (h.peringatan || []).join(' | '); }
        });
        return x => !st[x.id];
      };
      S.antrian.transaksi = S.antrian.transaksi.filter(beres(trx, r.transaksi, S.riwayat));
      S.antrian.kasKeluar = S.antrian.kasKeluar.filter(beres(kas, r.kasKeluar, S.kasLokal));
      const okShift = {}; (r.shift || []).forEach(x => { okShift[x.id] = true; });
      S.antrian.shift = S.antrian.shift.filter((x, i) => !(i < shf.length && okShift[x.id]));
      await Promise.all([simpanKe('antrian'), simpanKe('riwayat'), simpanKe('kasLokal')]);
      const tolak = (r.transaksi || []).concat(r.kasKeluar || []).filter(x => x.status === 'DITOLAK');
      if (tolak.length) tumpuk('⚠ ' + tolak.length + ' data DITOLAK server: ' + tolak[0].pesan + '\nLapor admin. Lihat di Riwayat.', 6000);
    }
    // 2) ambil data terbaru
    const d = await api('sync', {});
    S.master = d; S.syncJam = waktu();
    const batal = {}; (d.batal || []).forEach(b => { batal[b.id] = b; });
    let baruBatal = 0;
    S.riwayat.forEach(t => { const b = batal[t.id]; if (b && t.status !== 'BATAL') { t.status = 'BATAL'; t.pesan = 'Dibatalkan admin (' + b.oleh + '): ' + b.alasan; baruBatal++; } });
    await Promise.all([simpanKe('master'), simpanKe('syncJam'), simpanKe('riwayat')]);
    if (baruBatal) tumpuk(baruBatal + ' transaksi dibatalkan admin. Lihat di Riwayat.', 5000);
    if (S.kasir && !d.kasir.some(k => k.id === S.kasir.id)) { S.sedangSync = false; bukaPin('Kasir ' + S.kasir.nama + ' sudah tidak aktif di cabang ini.'); return; }
  } catch (e) {
    S.gagalSync = e.message;
    if (e.kode === 'TOKEN') { S.sedangSync = false; const n = belumTerkirim(); S.sesi.token = ''; await simpanKe('sesi'); S.kasir = null;
      bukaPasang(e.message + (n ? '\n' + n + ' data belum terkirim TETAP tersimpan di tablet ini, terkirim setelah login ulang.' : '')); return; }
    if (paksa) tumpuk('Sync gagal: ' + e.message, 4000);
  } finally { S.sedangSync = false; gambarSyncAman(); }
}

  const trx = S.riwayat.filter(t => cocok(t) && t.status !== 'BATAL');

  return { trx: trx, per: per, tunai: tunai, nonTunai: nonTunai, kas: kas, uangAwal: awal, seharusnya: awal + tunai - kas, batal: batal };

  const lama = S.shift.segmen, r = rekapShift(lama.no);
  modal('Ambil alih kasir dari ' + lama.nama, '<div class="hint" style="margin-bottom:8px;">Diizinkan admin ' + esc(iz.oleh) + ': ' + esc(iz.alasan) + '</div>' +
    '<div><b>' + esc(baru.nama) + '</b> mengambil alih kasir <b>' + esc(lama.nama) + '</b> (sejak ' + esc(lama.mulai.slice(11, 16)) + ').</div>' +
    htmlRekapSeg(r, lama.no === 1 ? 'Modal awal' : 'Uang awal (dari serah terima)') +
    '<label class="lbl" for="inAA">Hitung uang tunai di laci sekarang</label><input id="inAA" inputmode="numeric" class="angkaBesar">' +
    '<div class="angkaBesar" id="aaSel" style="font-size:18px; margin-top:8px;"></div>' +
    '<div class="hint">Selisih dicatat atas nama ' + esc(lama.nama) + '. Uang yang dihitung jadi uang awal ' + esc(baru.nama) + '.</div><div class="err" id="aaErr"></div>',
    [{ t: 'Batal', c: 'ghost', f: tutupModal }, { t: 'Ambil alih', c: 'hijau', id: 'btnAA', f: async () => {
      if ($('inAA').value === '') { $('aaErr').textContent = 'Isi uang yang dihitung.'; return; }
      const dihitung = nilaiRupiah($('inAA'));
      sibuk(true, 'Menyimpan...');
      const it = itemSerah(rekapShift(lama.no), dihitung, 'AMBIL_ALIH', baru);
      it.idIzin = iz.id;
      S.antrian.serahTerima.push(it);
      S.shift.segmen = { no: lama.no + 1, idKasir: baru.id, nama: baru.nama, mulai: it.selesai, uangAwal: dihitung };
      S.master.ambilAlih = null;
      await Promise.all([simpanKe('antrian'), simpanKe('shift'), simpanKe('master')]);
      sibuk(false); mOnTutup = null; $('modal').classList.remove('on');
      S.kasir = { id: baru.id, nama: baru.nama }; S.terakhirSentuh = Date.now();
      const sel = dihitung - it.uangAwal - it.tunai + it.kasKeluar;
      masukUtama();
      tumpuk('Kasir diambil alih. ' + lama.nama + ': ' + (sel === 0 ? 'pas' : (sel > 0 ? 'lebih ' : 'kurang ') + rp(Math.abs(sel))) + '. Selamat bertugas, ' + baru.nama + '.', 6000);
      sinkron();
    } }]);
  pasangSelisih($('inAA'), $('aaSel'), r.seharusnya);
  setTimeout(() => $('inAA').focus(), 50);
}

// ---------- HITUNG STOK HARIAN (draft, wajib sebelum tutup kasir) ----------
function daftarHitung() { return M().hitungTutup || []; }
function draftStok() {
  if (!S.stokDraft || !S.shift || S.stokDraft.idShift !== S.shift.id) S.stokDraft = { idShift: S.shift ? S.shift.id : '', item: {} };
  return S.stokDraft;
}
// berapa barang 'kode' terpakai transaksi shift ini SETELAH jam 'w'
function terpakaiSetelah(kode, w) {
  let n = 0;
  S.riwayat.forEach(t => {
    if (t.idShift !== S.shift.id || t.status === 'BATAL' || t.waktu <= w) return;
    t.item.forEach(it => {
      (it.potong || []).forEach(b => { if (b.kode === kode) n += b.jumlah * it.jumlah; });
      (it.opsi || []).forEach(o => (o.potong || []).forEach(b => { if (b.kode === kode) n += b.jumlah * it.jumlah; }));
    });
  });
  S.kasLokal.forEach(k => { if (k.idShift === S.shift.id && k.jenis === 'BELI' && k.kodeBarang === kode && k.waktu > w) n += Number(k.jumlah) || 0; });   // beli cabang juga mengubah stok
  return n;
}
function statusStok() {   // { lengkap, kurang: [nama], ulang: [{nama, n}] }
  const d = draftStok(), kurang = [], ulang = [];
  daftarHitung().forEach(b => {
    const x = d.item[b.kode];
    if (!x || !x.kotak.some(v => v !== '')) { kurang.push(b.nama); return; }
    const n = terpakaiSetelah(b.kode, x.waktu);
    if (n > 0) ulang.push({ nama: b.nama, n: n, kode: b.kode });
  });
  return { lengkap: !kurang.length && !ulang.length, kurang: kurang, ulang: ulang };
}
function dialogStokHarian() {
  if (!S.shift) { tumpuk('Kasir belum dibuka.'); return; }
  const l = daftarHitung();
  if (!l.length) { modal('Hitung stok harian', '<div class="kosongInfo">Cabang ini tidak punya barang wajib dihitung (diatur admin di Hub).</div>', [], null, { luar: true }); return; }
  const d = draftStok(), st = statusStok();
  const ulang = {}; st.ulang.forEach(x => { ulang[x.kode] = x.n; });
  modal('Hitung stok harian', '<div class="hint">Hitung sisa barang di cabang. Kotak kosong = 0, tapi tiap barang minimal 1 kotak diisi. Simpan sebagai draft, bisa diperbaiki sampai tutup kasir.</div>' +
    '<table class="tbl" style="margin-top:8px;">' + l.map(b => {
      const x = d.item[b.kode] || { kotak: [] }, n = Math.max(1, b.kotak || 1);
      return '<tr data-k="' + esc(b.kode) + '"><td style="min-width:120px;"><b>' + esc(b.nama) + '</b><div class="hint">' + esc(b.satuan) + '</div>' +
        (ulang[b.kode] ? '<div class="hint" style="color:var(--merah); font-weight:700;">terjual ' + angka(ulang[b.kode]) + ' setelah dihitung, hitung ulang</div>' : '') + '</td>' +
        '<td><div style="display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;">' +
          Array.from({ length: n }, (_, i) => '<input class="kt" inputmode="decimal" style="width:72px; text-align:right;' + (ulang[b.kode] ? ' border-color:var(--merah);' : '') + '" value="' + esc(x.kotak[i] === undefined ? '' : x.kotak[i]) + '" aria-label="' + esc(b.nama) + ' kotak ' + (i + 1) + '">').join('') +
        '</div></td><td class="r" style="width:80px;"><b class="jml">' + angka(jumlahKotak(x.kotak)) + '</b></td></tr>';
    }).join('') + '</table><div class="err" id="stkErr"></div>',
    [{ t: 'Batal', c: 'ghost', f: tutupModal }, { t: 'Simpan draft', c: 'hijau', f: async () => {
      const lama = draftStok().item, baru = {}, w = waktu();
      document.querySelectorAll('#mIsi tr[data-k]').forEach(tr => {
        const k = tr.dataset.k, kotak = Array.from(tr.querySelectorAll('.kt')).map(i => i.value.trim().replace(',', '.'));
        const ada = kotak.some(v => v !== '');
        if (!ada) return;
        const sama = lama[k] && JSON.stringify(lama[k].kotak) === JSON.stringify(kotak);
        baru[k] = { kotak: kotak, waktu: sama && !ulang[k] ? lama[k].waktu : w };
      });
      S.stokDraft = { idShift: S.shift.id, item: baru };
      await simpanKe('stokDraft');
      const s2 = statusStok();
      tutupModal();
      tumpuk(s2.lengkap ? '✓ Hitung stok harian lengkap. Bisa tutup kasir.' : 'Draft tersimpan. Belum dihitung: ' + s2.kurang.join(', '), 4000);
    } }]);
  document.querySelectorAll('#mIsi .kt').forEach(i => i.addEventListener('input', () => {
    i.value = i.value.replace(/[^\d.,]/g, ''); i.style.borderColor = '';
    const tr = i.closest('tr'); tr.querySelector('.jml').textContent = angka(jumlahKotak(Array.from(tr.querySelectorAll('.kt')).map(x => x.value.replace(',', '.'))));
  }));
}
function jumlahKotak(k) { return (k || []).reduce((a, v) => a + (Number(String(v).replace(',', '.')) || 0), 0); }

async function dialogTutup() {
  if (!S.shift) { tumpuk('Kasir belum dibuka.'); return; }
  if (S.kasir.id !== S.shift.segmen.idKasir) { tumpuk('Hanya kasir aktif yang bisa tutup kasir.'); return; }
  if (cekBelumSelesai('Belum bisa tutup kasir')) return;
  const st = statusStok();
  if (daftarHitung().length && !st.lengkap) {
    modal('Belum bisa tutup kasir', '<div style="white-space:pre-line;">Hitung Stok Harian belum lengkap.\n' +
      (st.kurang.length ? '• Belum dihitung: ' + esc(st.kurang.join(', ')) + '\n' : '') +
      (st.ulang.length ? '• Hitung ulang (terjual/dibeli setelah dihitung): ' + esc(st.ulang.map(x => x.nama + ' ' + angka(x.n)).join(', ')) + '\n' : '') + '</div>',
      [{ t: 'Tutup', c: 'ghost', f: tutupModal }, { t: 'Buka Hitung Stok Harian', f: () => { tutupModal(); dialogStokHarian(); } }]);
    return;
  }
  const r = rekapShift(S.shift.segmen.no), rAll = rekapShift(null);
  modal('Rekap kas & tutup kasir', '<div>Kasir: <b>' + esc(S.kasir.nama) + '</b> sejak ' + esc(S.shift.segmen.mulai.slice(11, 16)) + '</div>' +
    htmlRekapSeg(r, S.shift.segmen.no === 1 ? 'Modal awal' : 'Uang awal (dari serah terima)') +
    (S.shift.segmen.no > 1 ? '<div class="hint">Seluruh hari: ' + rAll.trx.length + ' transaksi, tunai ' + rp(rAll.tunai) + ', non-tunai ' + rp(rAll.nonTunai) + '.</div>' : '') +
    (daftarHitung().length ? '<div class="hint" style="color:var(--hijau); margin-top:6px;">✓ Hitung stok harian lengkap (' + daftarHitung().length + ' barang)</div>' : '') +
    '<label class="lbl" for="inSetor">Uang tunai dihitung (setoran)</label><input id="inSetor" inputmode="numeric" class="angkaBesar">' +
    '<div class="angkaBesar" id="selisih" style="font-size:18px; margin-top:8px;"></div>' +
    '<label class="lbl" for="inCatTutup">Catatan (opsional)</label><input id="inCatTutup" maxlength="200"><div class="err" id="ttpErr"></div>',
    [{ t: 'Batal', c: 'ghost', f: tutupModal }, { t: 'Tutup kasir', c: 'merah', id: 'btnTutupKasir', f: async () => {
      if ($('inSetor').value === '') { $('ttpErr').textContent = 'Isi uang tunai yang dihitung.'; return; }
      sibuk(true, 'Mengirim data & menutup kasir...');
      await sinkron(true);
      if (belumTerkirim()) { sibuk(false);
        $('ttpErr').textContent = 'Masih ada ' + belumTerkirim() + ' data belum terkirim (' + (S.gagalSync || 'cek internet') + '). Tutup kasir harus menunggu semua terkirim supaya rekap di Hub cocok.'; return; }
      const st2 = statusStok();
      if (daftarHitung().length && !st2.lengkap) { sibuk(false); $('ttpErr').textContent = 'Ada barang terjual setelah dihitung / dibatalkan admin. Buka Hitung Stok Harian lagi.'; return; }
      const r2 = rekapShift(S.shift.segmen.no), all = rekapShift(null), setor = nilaiRupiah($('inSetor'));
      const d = draftStok();
      const stok = daftarHitung().map(b => { const x = d.item[b.kode]; return { kode: b.kode, fisik: jumlahKotak(x.kotak), kotak: x.kotak, waktu: x.waktu }; });
      S.antrian.serahTerima.push(itemSerah(r2, setor, 'TUTUP', null));
      S.antrian.shift.push({ id: S.shift.id, idKasir: S.shift.idKasir, idKasirTutup: S.kasir.id, namaKasirTutup: S.kasir.nama, buka: S.shift.buka, modal: S.shift.modal,
        tutup: waktu(), tunai: all.tunai, nonTunai: all.nonTunai, kasKeluar: all.kas, setoran: setor, jumlahTrx: all.trx.length, stok: stok, catatan: $('inCatTutup').value.trim() });
      await simpanKe('antrian');
      await sinkron(true);
      const sel = setor - r2.seharusnya;
      S.shift = null; S.stokDraft = null; await Promise.all([simpanKe('shift'), simpanKe('stokDraft')]);
      sibuk(false); tutupModal();
      modal('Kasir ditutup', '<div class="angkaBesar">' + (sel === 0 ? '✓ Setoran pas' : (sel > 0 ? 'Lebih ' : 'Kurang ') + rp(Math.abs(sel))) + '</div>' +
        '<div class="hint" style="text-align:center; margin-top:8px;">Setoran ' + rp(setor) + ', seharusnya ' + rp(r2.seharusnya) + '.' + (S.antrian.shift.length ? ' Rekap terkirim saat ada internet.' : ' Rekap sudah terkirim ke Hub.') + '</div>',
        [{ t: 'Selesai', f: () => { tutupModal(); bukaPin('Kasir sudah ditutup.'); } }], () => bukaPin('Kasir sudah ditutup.'));
    } }]);
  pasangSelisih($('inSetor'), $('selisih'), r.seharusnya);
}
// ---------- atur tampilan (per cabang, disimpan ke server) ----------
function dialogTampilan() {
  const td = JSON.parse(JSON.stringify(tampilanData()));
  td.kategori = kategoriUrut().map(k => k.kode); td.sembunyi = td.sembunyi || []; td.produk = td.produk || {};
  M().kategori.forEach(k => { td.produk[k.kode] = produkKategoriUrut(k.kode, td).map(p => p.kode); });
  let bagian = '#kat';   // '#kat' = urutan kategori, selain itu kode kategori
  const tombolGeser = (i, n, attr) => '<span class="step">' +
    '<button ' + attr + '="' + i + '" data-d="atas"' + (i ? '' : ' disabled') + ' aria-label="Paling atas">⤒</button>' +
    '<button ' + attr + '="' + i + '" data-d="-1"' + (i ? '' : ' disabled') + ' aria-label="Naik">↑</button>' +
    '<button ' + attr + '="' + i + '" data-d="1"' + (i < n - 1 ? '' : ' disabled') + ' aria-label="Turun">↓</button>' +
    '<button ' + attr + '="' + i + '" data-d="bawah"' + (i < n - 1 ? '' : ' disabled') + ' aria-label="Paling bawah">⤓</button></span>';
  const gambar = () => {
    let html = '<label class="lbl" for="tpBagian" style="margin-top:0;">Yang diatur</label><select id="tpBagian"><option value="#kat">Urutan kategori (kolom kiri)</option>' +
      td.kategori.map(k => { const kat = M().kategori.find(x => x.kode === k); return kat ? '<option value="' + esc(k) + '"' + (bagian === k ? ' selected' : '') + '>Isi kategori: ' + esc(kat.nama) + ' (' + td.produk[k].length + ')</option>' : ''; }).join('') + '</select>';
    if (bagian === '#kat') {
      html += '<div class="hint" style="margin:8px 0;">"Semua" selalu paling atas.</div>' + td.kategori.map((k, i) => {
        const kat = M().kategori.find(x => x.kode === k);
        return '<div class="opRow"><span class="nm">' + esc(kat ? kat.nama : k) + '</span>' + tombolGeser(i, td.kategori.length, 'data-k') + '</div>';
      }).join('');
    } else {
      const list = td.produk[bagian] || [], pm = produkMap();
      html += '<div class="hint" style="margin:8px 0;">⤒ = langsung paling atas. Hilangkan centang untuk menyembunyikan produk di cabang ini.</div>' +
        (list.length ? list.map((kode, i) => '<div class="opRow"><input type="checkbox" data-s="' + esc(kode) + '" style="width:24px; min-height:24px;" aria-label="Tampil"' +
          (td.sembunyi.indexOf(kode) < 0 ? ' checked' : '') + '><span class="nm"' + (td.sembunyi.indexOf(kode) < 0 ? '' : ' style="opacity:.45; text-decoration:line-through;"') + '><b>' + (i + 1) + '.</b> ' +
          esc(pm[kode] ? pm[kode].nama : kode) + '</span>' + tombolGeser(i, list.length, 'data-p') + '</div>').join('') : '<div class="kosongInfo">Tidak ada produk di kategori ini.</div>');
    }
    $('mIsi').innerHTML = html + '<div class="err" id="tpErr"></div>';
  };
  const geser = (arr, i, d) => {
    const x = arr.splice(i, 1)[0];
    const j = d === 'atas' ? 0 : d === 'bawah' ? arr.length : i + Number(d);
    arr.splice(j, 0, x);
  };
  modal('Atur tampilan ' + S.sesi.cabang.nama, '', [{ t: 'Batal', c: 'ghost', f: tutupModal }, { t: 'Simpan', id: 'btnTp', f: async () => {
    sibuk(true, 'Menyimpan tampilan...');
    try {
      const r = await api('simpanTampilan', { tampilan: td, idKasir: S.kasir.id });
      S.master.tampilan = r.tampilan; await simpanKe('master'); sibuk(false); tutupModal(); gambarSemua(); tumpuk(r.pesan, 4000);
    } catch (e) { sibuk(false); $('tpErr').textContent = 'Gagal (' + e.message + '). Atur tampilan butuh internet.'; }
  } }]);
  $('mIsi').onclick = e => {
    const b = e.target.closest('button[data-d]'); if (!b || b.disabled) return;
    const sc = $('mIsi').scrollTop;
    if (b.dataset.k !== undefined) geser(td.kategori, Number(b.dataset.k), b.dataset.d);
    else geser(td.produk[bagian], Number(b.dataset.p), b.dataset.d);
    gambar(); $('mIsi').scrollTop = b.dataset.d === 'atas' ? 0 : sc;
  };
  $('mIsi').onchange = e => {
    if (e.target.id === 'tpBagian') { bagian = e.target.value; gambar(); return; }
    const c = e.target.closest('input[data-s]'); if (!c) return; const k = c.dataset.s;
    td.sembunyi = td.sembunyi.filter(x => x !== k); if (!c.checked) td.sembunyi.push(k);
    const sc = $('mIsi').scrollTop; gambar(); $('mIsi').scrollTop = sc;
  };
  gambar();
}
// ---------- keluar perangkat ----------
function keluarPerangkat() {
  const n = belumTerkirim() + S.antrian.shift.length;   // serah terima sudah ikut belumTerkirim
  if (n) { tumpuk('Masih ada ' + n + ' data belum terkirim. Sync dulu sebelum keluar.', 4000); return; }
  if (S.shift) { tumpuk('Kasir masih terbuka. Tutup kasir dulu.', 4000); return; }
  tanya('Keluar perangkat?', 'Tablet ini harus login lagi dengan akun cabang untuk dipakai.', async () => {
    try { await api('logout', {}); } catch (e) { /* tetap keluar di tablet */ }
    S.sesi.token = ''; S.kasir = null; await simpanKe('sesi'); bukaPasang();
  }, 'Keluar', 'merah');
}

// =====================================================================
// MULAI
// =====================================================================
(async function mulai() {
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  try { await muatSemua(); } catch (e) { alert('Penyimpanan tablet tidak bisa dibuka: ' + e.message); }
  if (!S.sesi || !S.sesi.token) { bukaPasang(belumTerkirim() ? belumTerkirim() + ' data belum terkirim tersimpan di tablet ini. Login lagi untuk mengirimnya.' : ''); return; }
  bukaPin();
  sinkron();
})();
</script>
